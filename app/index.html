<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#3056d3">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Finanzas">
<meta name="format-detection" content="telephone=no">
<meta name="description" content="Finanzas familiares: tarjetas, presupuesto, plan de pago y metas. App local; sincronización opcional y cifrada.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Mis cuentas</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%233056d3'/%3E%3Ctext x='16' y='22.5' font-size='18' font-family='Arial' font-weight='700' text-anchor='middle' fill='white'%3E$%3C/text%3E%3C/svg%3E">
<style>
/* ===================== Tokens ===================== */
:root{
  --bg:#f5f7fb; --surface:#ffffff; --surface-2:#f8fafc; --surface-3:#f1f4f9;
  --ink:#0f172a; --ink-2:#334155; --muted:#64748b; --faint:#94a3b8;
  --line:#e5e9f0; --line-2:#eef1f6;
  --primary:#3056d3; --primary-ink:#ffffff; --primary-soft:#eaf0ff; --primary-strong:#2443b5;
  --good:#0e9f6e; --good-soft:#e6f6ef; --warn:#c77700; --warn-soft:#fff5e0; --bad:#dc2626; --bad-soft:#fdecec;
  --violet:#7c3aed; --violet-soft:#f1ebff; --teal:#0d9488; --teal-soft:#e2f5f3; --info:#0369a1; --info-soft:#e6f2fb;
  --input:#ffffff; --input-line:#d7dde8;
  --shadow-sm:0 1px 2px rgba(15,23,42,.05);
  --shadow:0 1px 2px rgba(15,23,42,.04),0 2px 8px rgba(15,23,42,.05);
  --shadow-lg:0 12px 40px rgba(15,23,42,.16);
  --r-sm:8px; --r:12px; --r-lg:16px;
  --font:"Inter","Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b1120; --surface:#111a2e; --surface-2:#152036; --surface-3:#1a2640;
  --ink:#e8edf6; --ink-2:#c3cbdb; --muted:#8a96ad; --faint:#64708a;
  --line:#22304b; --line-2:#1b2740;
  --primary:#6b8cff; --primary-ink:#0b1120; --primary-soft:#1b2a4f; --primary-strong:#8aa5ff;
  --good:#34d399; --good-soft:#0f2e25; --warn:#fbbf24; --warn-soft:#33270b; --bad:#f87171; --bad-soft:#3a1616;
  --violet:#a78bfa; --violet-soft:#251a42; --teal:#2dd4bf; --teal-soft:#0e2d2b; --info:#7dd3fc; --info-soft:#0c2638;
  --input:#0f182b; --input-line:#2a3a5a;
  --shadow-sm:none; --shadow:0 1px 0 rgba(255,255,255,.02); --shadow-lg:0 20px 60px rgba(0,0,0,.5);
  color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0b1120; --surface:#111a2e; --surface-2:#152036; --surface-3:#1a2640;
  --ink:#e8edf6; --ink-2:#c3cbdb; --muted:#8a96ad; --faint:#64708a;
  --line:#22304b; --line-2:#1b2740;
  --primary:#6b8cff; --primary-ink:#0b1120; --primary-soft:#1b2a4f; --primary-strong:#8aa5ff;
  --good:#34d399; --good-soft:#0f2e25; --warn:#fbbf24; --warn-soft:#33270b; --bad:#f87171; --bad-soft:#3a1616;
  --violet:#a78bfa; --violet-soft:#251a42; --teal:#2dd4bf; --teal-soft:#0e2d2b; --info:#7dd3fc; --info-soft:#0c2638;
  --input:#0f182b; --input-line:#2a3a5a;
  --shadow-sm:none; --shadow:0 1px 0 rgba(255,255,255,.02); --shadow-lg:0 20px 60px rgba(0,0,0,.5);
  color-scheme:dark;}

/* ===================== Base ===================== */
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--font);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;letter-spacing:-.01em}
a{color:var(--primary)}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.num,.tnum{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .faint{color:var(--faint)} .good{color:var(--good)} .bad{color:var(--bad)} .warn{color:var(--warn)}
.tiny{font-size:12px} .small{font-size:13px} .b{font-weight:600} .nowrap{white-space:nowrap}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ===================== Shell ===================== */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.side{background:var(--surface);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
.brand{display:flex;gap:11px;align-items:center;padding:18px 18px 14px}
.brand .mark{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#3056d3,#6b8cff);display:grid;place-items:center;color:#fff;box-shadow:0 4px 12px rgba(48,86,211,.35)}
.brand .mark svg{width:20px;height:20px}
.brand b{display:block;font-size:14.5px}.brand small{color:var(--muted);font-size:11.5px}
.nav{flex:1;overflow:auto;padding:4px 10px 10px}
.nav .grp{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);font-weight:700;padding:14px 10px 6px}
.nav button{width:100%;display:flex;align-items:center;gap:10px;border:0;background:none;padding:7px 10px;border-radius:8px;cursor:pointer;color:var(--ink-2);text-align:left;font-size:13.5px;transition:background .12s}
.nav button:hover{background:var(--surface-3)}
.nav button.on{background:var(--primary-soft);color:var(--primary);font-weight:600}
.nav button svg{width:17px;height:17px;flex:none;opacity:.9}
.nav .count{margin-left:auto;font-size:11px;font-weight:700;min-width:20px;text-align:center;padding:0 6px;border-radius:99px;background:var(--bad-soft);color:var(--bad)}
.nav .count.ok{background:var(--good-soft);color:var(--good)}
.side-foot{border-top:1px solid var(--line);padding:12px 14px;font-size:12px;color:var(--muted)}
.save-state{display:flex;align-items:flex-start;gap:8px}
.save-state .dot{width:8px;height:8px;border-radius:50%;background:var(--warn);margin-top:5px;flex:none}
.save-state .dot.ok{background:var(--good);box-shadow:0 0 0 3px var(--good-soft)}
.save-state b{color:var(--ink-2);font-weight:600}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:10px 28px;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line-2)}
.search{flex:1;min-width:0;max-width:440px;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 12px;color:var(--muted);cursor:pointer;box-shadow:var(--shadow-sm)}
.search svg{width:16px;height:16px;flex:none}
.search span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drawer .cc{width:100%}
html,body{overflow-x:hidden}
.search kbd{margin-left:auto}
kbd{font:11px var(--font);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;background:var(--surface-2);color:var(--muted)}
.topbar .sp{flex:1}
.content{padding:24px 28px 80px;max-width:1320px;width:100%}

/* ===================== Page header ===================== */
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.ph h1{font-size:24px;font-weight:700}
.ph p{margin:4px 0 0;color:var(--muted);max-width:720px}
.ph .eyebrow{font-size:11.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--primary);font-weight:700;margin-bottom:4px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px}

/* ===================== Buttons ===================== */
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);padding:7px 13px;border-radius:9px;cursor:pointer;font-weight:500;font-size:13.5px;box-shadow:var(--shadow-sm);transition:border-color .12s,background .12s,transform .05s;white-space:nowrap}
.btn:hover{border-color:var(--faint)}
.btn:active{transform:translateY(1px)}
.btn svg{width:16px;height:16px}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.btn.primary:hover{background:var(--primary-strong);border-color:var(--primary-strong)}
.btn.ghost{background:none;border-color:transparent;box-shadow:none}
.btn.ghost:hover{background:var(--surface-3)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:4px 10px;font-size:12.5px;border-radius:8px}
.btn.icon{padding:7px}
.btn[disabled]{opacity:.5;pointer-events:none}
.iconbtn{border:0;background:none;cursor:pointer;color:var(--faint);padding:5px;border-radius:7px;display:inline-grid;place-items:center}
.iconbtn:hover{background:var(--surface-3);color:var(--ink)}
.iconbtn.del:hover{color:var(--bad);background:var(--bad-soft)}
.iconbtn svg{width:16px;height:16px}

/* ===================== Layout ===================== */
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g21{grid-template-columns:minmax(0,1.65fr) minmax(0,1fr)}
.g12{grid-template-columns:minmax(0,1fr) minmax(0,1.65fr)}
.mt{margin-top:16px}.mt2{margin-top:24px}
.span2{grid-column:span 2}

/* ===================== Panels ===================== */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow);min-width:0}
.panel > .hd{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 18px 0}
.panel > .hd h3{font-size:14.5px;font-weight:650;display:flex;align-items:center;gap:8px}
.panel > .hd .sub{font-size:12px;color:var(--muted);font-weight:400}
.panel > .bd{padding:14px 18px 18px}
.panel.flush > .bd{padding:0}
.panel.soft{background:var(--surface-2);box-shadow:none}
.section{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:28px 0 12px;display:flex;align-items:center;gap:10px}
.section::after{content:"";flex:1;height:1px;background:var(--line)}

/* KPI */
.kpi{padding:16px 18px;position:relative}
.kpi .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.kpi .lbl{font-size:12px;color:var(--muted);font-weight:600}
.kpi .ico{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:var(--tone-soft,var(--primary-soft));color:var(--tone,var(--primary));flex:none}
.kpi .ico svg{width:17px;height:17px}
.kpi .val{font-size:27px;font-weight:700;letter-spacing:-.025em;margin:4px 0 6px;font-variant-numeric:tabular-nums;line-height:1.15}
.kpi .foot{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);flex-wrap:wrap}

/* Pills */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:99px;white-space:nowrap;background:var(--surface-3);color:var(--muted)}
.pill.good{background:var(--good-soft);color:var(--good)} .pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.info{background:var(--primary-soft);color:var(--primary)}
.pill.violet{background:var(--violet-soft);color:var(--violet)}
.pill .d{width:6px;height:6px;border-radius:50%;background:currentColor}

/* Hero */
.hero{background:linear-gradient(120deg,#1e3a8a 0%,#3056d3 55%,#6b8cff 100%);color:#fff;border-radius:var(--r-lg);padding:22px 24px;display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:20px;position:relative;overflow:hidden;box-shadow:0 10px 30px rgba(48,86,211,.25)}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:260px;height:260px;border-radius:50%;background:rgba(255,255,255,.07)}
.hero h2{font-size:21px;font-weight:700;margin:4px 0 6px}
.hero p{margin:0;opacity:.9;font-size:13.5px}
.hero .eyebrow{font-size:11px;letter-spacing:.1em;text-transform:uppercase;opacity:.75;font-weight:700}
.hero .todo{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;position:relative;z-index:1}
.hero .todo .it{display:flex;justify-content:space-between;gap:10px;font-size:13px}
.hero .todo .it b{font-variant-numeric:tabular-nums}
.hero .btn{background:#fff;color:#1e3a8a;border-color:#fff}
.hero .btn.ghost{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.25)}

/* Tables */
.tbl{overflow:auto;border-radius:var(--r-lg)}
table{border-collapse:separate;border-spacing:0;width:100%;font-variant-numeric:tabular-nums}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;text-align:left;padding:10px 14px;background:var(--surface-2);border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0;z-index:1}
td{padding:10px 14px;border-bottom:1px solid var(--line-2);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr{transition:background .1s}
tbody tr:hover{background:var(--surface-2)}
tfoot td{background:var(--surface-2);font-weight:700;border-top:1px solid var(--line);border-bottom:0}
td.r,th.r{text-align:right} td.c,th.c{text-align:center}
tr.grp td{background:var(--surface-3);font-weight:700;font-size:12.5px;padding:8px 14px;color:var(--ink-2)}
tr.click,td.click{cursor:pointer}
.cell-title{font-weight:600}
.cell-sub{font-size:12px;color:var(--muted);margin-top:1px}
.swatch{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:8px;vertical-align:-1px}

/* Inline inputs */
.inl{width:112px;height:32px;padding:4px 9px;border:1px solid var(--input-line);border-radius:8px;background:var(--input);text-align:right;font-variant-numeric:tabular-nums;transition:border-color .12s,box-shadow .12s}
.inl:hover{border-color:var(--faint)}
.inl:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.inl.day{width:58px;text-align:center}
.inl.blank{background:var(--warn-soft);border-style:dashed}
.inl.saved{animation:flash .8s}
@keyframes flash{0%{box-shadow:0 0 0 3px var(--good-soft);border-color:var(--good)}100%{box-shadow:none}}

/* Progress & rings */
.prog{height:8px;background:var(--surface-3);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--primary);border-radius:99px;transition:width .4s}
.prog.good i{background:var(--good)} .prog.warn i{background:var(--warn)} .prog.bad i{background:var(--bad)} .prog.violet i{background:var(--violet)} .prog.teal i{background:var(--teal)}
.prog.lg{height:12px}
.ring{position:relative;display:inline-grid;place-items:center}
.ring b{position:absolute;font-size:18px;font-variant-numeric:tabular-nums}
.ring small{position:absolute;top:58%;font-size:10.5px;color:var(--muted)}

/* Alerts */
.alerts{display:flex;flex-direction:column;gap:8px}
.alert{display:flex;gap:11px;align-items:flex-start;padding:11px 13px;border-radius:11px;font-size:13px;border:1px solid transparent}
.alert.bad{background:var(--bad-soft);border-color:color-mix(in srgb,var(--bad) 18%,transparent)}
.alert.warn{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 18%,transparent)}
.alert.good{background:var(--good-soft)} .alert.info{background:var(--info-soft)}
.alert .ai{font-size:16px;line-height:1.25;flex:none}
.alert .at{font-weight:650;display:block;color:var(--ink)}
.alert .det{color:var(--ink-2)}

/* Credit cards */
.ccs{display:grid;grid-template-columns:repeat(auto-fill,minmax(285px,1fr));gap:16px}
.cc{border-radius:16px;padding:18px;color:#fff;position:relative;cursor:pointer;min-height:178px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 10px 24px rgba(15,23,42,.18);overflow:hidden;transition:transform .15s,box-shadow .15s;border:0;text-align:left}
.cc:hover{transform:translateY(-2px);box-shadow:0 16px 32px rgba(15,23,42,.24)}
.cc::before{content:"";position:absolute;right:-40px;bottom:-70px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.08)}
.cc .chip{width:34px;height:25px;border-radius:5px;background:linear-gradient(135deg,#f6d77a,#c9a227);opacity:.9}
.cc .nm{font-weight:700;font-size:16px}.cc .ow{font-size:12px;opacity:.8}
.cc .bal{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.cc .meta{display:flex;justify-content:space-between;font-size:12px;opacity:.9;gap:8px}
.cc .bar{height:5px;background:rgba(255,255,255,.22);border-radius:9px;overflow:hidden;margin:8px 0}
.cc .bar i{display:block;height:100%;background:#fff;border-radius:9px}
.cc .tag{position:absolute;top:16px;right:16px;font-size:11px;font-weight:600;background:rgba(255,255,255,.18);padding:3px 9px;border-radius:99px;backdrop-filter:blur(4px)}
.cc.add{background:var(--surface);border:2px dashed var(--line);color:var(--muted);align-items:center;justify-content:center;box-shadow:none;gap:6px}
.cc.add:hover{border-color:var(--primary);color:var(--primary)}
.cc.add::before{display:none}

/* Checklist */
.check{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;transition:background .12s,border-color .12s;user-select:none}
.check:hover{border-color:var(--faint)}
.check .box{width:22px;height:22px;border-radius:7px;border:2px solid var(--input-line);display:grid;place-items:center;flex:none;transition:.15s}
.check .box svg{width:14px;height:14px;opacity:0;color:#fff}
.check.on{background:var(--good-soft);border-color:color-mix(in srgb,var(--good) 30%,transparent)}
.check.on .box{background:var(--good);border-color:var(--good)}
.check.on .box svg{opacity:1}
.check.on .nm{text-decoration:line-through;color:var(--muted)}
.check .nm{flex:1;min-width:0}
.check .day{font-size:11px;font-weight:700;color:var(--muted);width:38px;text-align:center;background:var(--surface-3);border-radius:6px;padding:2px 0;flex:none}
.check .amt{font-weight:650}
.checks{display:flex;flex-direction:column;gap:7px}

/* Calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal .dow{font-size:11px;text-transform:uppercase;color:var(--muted);text-align:center;font-weight:700;padding-bottom:2px}
.cal .day{min-height:104px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px;font-size:11.5px;display:flex;flex-direction:column;gap:3px;min-width:0}
.cal .day.out{background:transparent;border-style:dashed;opacity:.5}
.cal .day.today{border-color:var(--primary);box-shadow:0 0 0 2px var(--primary-soft)}
.cal .day .n{font-weight:700;font-size:12px;color:var(--muted)}
.ev{border-radius:5px;padding:1px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.ev.in{background:var(--good-soft);color:var(--good)} .ev.out{background:var(--warn-soft);color:var(--warn)}
.ev.evcard{background:var(--bad-soft);color:var(--bad)} .ev.cut{background:var(--surface-3);color:var(--muted)}
.ev.done{text-decoration:line-through;opacity:.55}

/* Legend / kv */
.legend{display:flex;flex-direction:column;gap:7px;font-size:13px;min-width:0}
.legend .li{display:flex;align-items:center;gap:9px;min-width:0}
.legend .li i{width:10px;height:10px;border-radius:3px;flex:none}
.legend .li span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.legend .li em{margin-left:auto;font-style:normal;color:var(--muted);font-variant-numeric:tabular-nums;padding-left:8px}
.kv{display:grid;grid-template-columns:1fr auto;gap:8px 16px;font-size:13px}
.kv > span:nth-of-type(even){text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.kv hr{grid-column:1/-1;border:0;border-top:1px solid var(--line);margin:2px 0}
.donut-wrap{display:grid;grid-template-columns:190px minmax(0,1fr);gap:20px;align-items:center}

/* Tabs / segmented */
.seg{display:inline-flex;background:var(--surface-3);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:5px 12px;border-radius:8px;cursor:pointer;font-size:13px;color:var(--muted);font-weight:500}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-sm)}
.monthnav{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:2px}
.monthnav b{padding:0 10px;min-width:130px;text-align:center;text-transform:capitalize;font-size:13.5px}

/* Achievements */
.ach{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px}
.ach .a{border:1px solid var(--line);border-radius:12px;padding:12px 8px;text-align:center;font-size:11.5px;background:var(--surface-2)}
.ach .a .e{font-size:24px;display:block;margin-bottom:2px}
.ach .a.lock{opacity:.38;filter:grayscale(1)}
.ach .a.ok{background:var(--good-soft);border-color:color-mix(in srgb,var(--good) 25%,transparent)}

/* Steps (ruta) */
.steps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;counter-reset:s}
.step{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--surface);position:relative}
.step.cur{border-color:var(--primary);background:var(--primary-soft)}
.step.done{background:var(--good-soft);border-color:color-mix(in srgb,var(--good) 25%,transparent)}
.step .t{font-weight:650;margin:8px 0 4px;font-size:13.5px}

/* Empty */
.empty{padding:36px 20px;text-align:center;color:var(--muted)}
.empty .ei{width:44px;height:44px;border-radius:12px;background:var(--surface-3);display:grid;place-items:center;margin:0 auto 10px;color:var(--faint)}
.empty .ei svg{width:22px;height:22px}
.empty b{display:block;color:var(--ink-2);margin-bottom:4px}

/* Quote */
.quote{margin-top:28px;padding:16px 20px;border-radius:14px;background:var(--warn-soft);color:var(--warn);font-style:italic;font-weight:600;text-align:center;border:1px dashed color-mix(in srgb,var(--warn) 35%,transparent)}

/* Callout */
.callout{background:var(--primary-soft);border-radius:12px;padding:12px 14px;font-size:13px;color:var(--ink-2)}
.callout.good{background:var(--good-soft)} .callout.warn{background:var(--warn-soft)} .callout.bad{background:var(--bad-soft)}

/* Forms */
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 16px}
.fsec{grid-column:1/-1;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--primary);font-weight:700;margin-top:10px;padding-bottom:6px;border-bottom:1px solid var(--line-2)}
.fsec:first-child{margin-top:0}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld.full{grid-column:1/-1}
.fld label{font-size:12.5px;font-weight:600;color:var(--ink-2)}
.fld .req{color:var(--bad)}
.fld small{font-size:11.5px;color:var(--muted)}
.fld .err{font-size:11.5px;color:var(--bad);display:none}
.fld.invalid input,.fld.invalid select{border-color:var(--bad)}
.fld.invalid .err{display:block}
.inp,.fld input,.fld select,.fld textarea{width:100%;height:38px;padding:7px 11px;border:1px solid var(--input-line);border-radius:9px;background:var(--input);transition:border-color .12s,box-shadow .12s}
.fld textarea{height:auto;min-height:70px;resize:vertical}
.inp:focus,.fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.affix{position:relative}
.affix > span{position:absolute;top:50%;transform:translateY(-50%);color:var(--muted);font-size:13px;pointer-events:none}
.affix .pre{left:11px}.affix .suf{right:11px}
.affix .pre ~ input{padding-left:24px}
.affix .suf ~ input,.affix input:has(+ .suf){padding-right:28px}
input[type=range]{width:100%;accent-color:var(--primary)}

/* Overlays */
.overlay{position:fixed;inset:0;background:rgba(8,13,28,.5);backdrop-filter:blur(2px);display:none;z-index:60}
.overlay.on{display:block}
.modal{position:fixed;left:50%;top:6vh;transform:translateX(-50%);width:min(780px,calc(100vw - 24px));max-height:88vh;background:var(--surface);border-radius:18px;box-shadow:var(--shadow-lg);display:none;flex-direction:column;z-index:61;border:1px solid var(--line)}
.modal.on{display:flex;animation:pop .16s ease-out}
.modal.sm{width:min(520px,calc(100vw - 24px))}
@keyframes pop{from{opacity:0;transform:translate(-50%,8px) scale(.98)}to{opacity:1;transform:translate(-50%,0)}}
.modal header{padding:18px 22px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.modal header h2{font-size:17px}
.modal header p{margin:3px 0 0;color:var(--muted);font-size:13px}
.modal .mb{padding:16px 22px;overflow:auto}
.modal footer{padding:14px 22px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.drawer{position:fixed;right:0;top:0;bottom:0;width:min(560px,100vw);background:var(--surface);box-shadow:var(--shadow-lg);z-index:61;display:flex;flex-direction:column;transform:translateX(105%);transition:transform .22s ease;border-left:1px solid var(--line)}
.drawer.on{transform:none}
.drawer > header{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.drawer > .db{padding:18px 20px;overflow:auto;flex:1}

/* Command palette */
.palette{position:fixed;left:50%;top:12vh;transform:translateX(-50%);width:min(620px,calc(100vw - 24px));background:var(--surface);border-radius:16px;box-shadow:var(--shadow-lg);z-index:62;display:none;overflow:hidden;border:1px solid var(--line)}
.palette.on{display:block;animation:pop .14s ease-out}
.palette input{width:100%;border:0;border-bottom:1px solid var(--line);padding:16px 18px;font-size:15px;background:transparent;outline:none}
.palette .list{max-height:52vh;overflow:auto;padding:6px}
.palette .it{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;cursor:pointer;font-size:13.5px}
.palette .it svg{width:16px;height:16px;color:var(--muted)}
.palette .it.sel{background:var(--primary-soft);color:var(--primary)}
.palette .it.sel svg{color:var(--primary)}
.palette .it em{margin-left:auto;font-style:normal;font-size:11.5px;color:var(--faint)}
.palette .grp{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);font-weight:700;padding:10px 12px 4px}

/* Wizard */
.wiz-steps{display:flex;gap:6px;margin-top:12px}
.wiz-steps i{flex:1;height:4px;border-radius:9px;background:var(--surface-3)}
.wiz-steps i.on{background:var(--primary)}
.wiz-hero{font-size:44px;text-align:center;margin:6px 0}
.wiz-list{display:flex;flex-direction:column;gap:10px}
.wiz-row{display:grid;grid-template-columns:minmax(0,1.3fr) repeat(3,minmax(0,1fr));gap:10px;align-items:end;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2)}
.wiz-row.two{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}

/* Toast */
.toasts{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:80;align-items:center}
.toast{background:#0f172a;color:#fff;padding:10px 14px 10px 16px;border-radius:12px;font-size:13.5px;box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:12px;animation:pop2 .2s ease-out}
.toast button{background:none;border:0;color:#93b4ff;font-weight:700;cursor:pointer;padding:2px 4px}
@keyframes pop2{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* FAB */
.fab{position:fixed;right:22px;bottom:22px;z-index:30;width:52px;height:52px;border-radius:16px;border:0;background:var(--primary);color:#fff;display:grid;place-items:center;box-shadow:0 10px 24px rgba(48,86,211,.4);cursor:pointer;transition:transform .15s}
.fab:hover{transform:translateY(-2px)}
.fab svg{width:24px;height:24px}
.fab-menu{position:fixed;right:22px;bottom:84px;z-index:30;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-lg);padding:6px;display:none;min-width:230px}
.fab-menu.on{display:block;animation:pop2 .15s}
.fab-menu button{width:100%;display:flex;gap:10px;align-items:center;border:0;background:none;padding:9px 12px;border-radius:9px;cursor:pointer;text-align:left;font-size:13.5px}
.fab-menu button:hover{background:var(--surface-3)}
.fab-menu svg{width:17px;height:17px;color:var(--primary)}

/* Quick add */
.quick{display:grid;grid-template-columns:130px minmax(0,1.6fr) minmax(0,1fr) 120px auto;gap:8px;align-items:center}

/* Privacy */
body.priv .amt,body.priv .kpi .val,body.priv .cc .bal,body.priv .alert .det,body.priv td.r,body.priv .legend em,body.priv .inl,body.priv .hero .todo b,body.priv .kv > span:nth-of-type(even),body.priv .check .amt,body.priv svg text.amt{filter:blur(7px);transition:filter .15s}
body.priv .amt:hover,body.priv td.r:hover{filter:none}

/* Report (imprimible) */
.paper{background:#fff;color:#111;border-radius:12px;box-shadow:var(--shadow);padding:34px 38px;max-width:820px;margin:0 auto;border:1px solid var(--line)}
.paper h2{font-size:22px}
.paper .pmeta{color:#555;font-size:12.5px;margin-top:2px}
.paper table th{background:#f3f4f6;color:#333}
.paper td,.paper th{border-color:#e5e7eb}
.paper .boxes{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0}
.paper .boxes div{border:1px solid #e5e7eb;border-radius:10px;padding:10px 12px}
.paper .boxes small{display:block;color:#666;font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.paper .boxes b{font-size:18px}
.paper .sq{display:inline-block;width:14px;height:14px;border:1.5px solid #333;border-radius:3px;vertical-align:-2px}
.paper .notes{border:1px dashed #bbb;border-radius:10px;height:110px;margin-top:8px}
.paper h3{font-size:14px;margin:22px 0 8px;text-transform:uppercase;letter-spacing:.06em;color:#333}

/* QA */
.qa{display:flex;flex-direction:column;gap:14px}
.qa label{font-weight:600;font-size:13px;display:flex;flex-direction:column;gap:6px}
.qa textarea{width:100%;padding:9px 11px;border:1px solid var(--input-line);border-radius:9px;background:var(--input);min-height:62px;resize:vertical;font-weight:400}

/* Toolbar */
.toolbar .inp[type=search]{width:min(360px,100%)}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.toolbar .inp{height:34px;width:auto}
.toolbar .grow{flex:1;min-width:180px}

/* Responsive */
.menu-btn{display:none}
@media (max-width:1180px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g21,.g12{grid-template-columns:minmax(0,1fr)}.steps{grid-template-columns:repeat(2,minmax(0,1fr))}.hero{grid-template-columns:minmax(0,1fr)}}
@media (max-width:860px){
  .topbar .btn.primary span{display:none}
  .ph .row{width:100%}
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;left:0;top:0;z-index:70;width:270px;transform:translateX(-100%);transition:transform .2s;box-shadow:var(--shadow-lg)}
  .side.on{transform:none}
  .menu-btn{display:inline-flex}
  .topbar{padding:10px 14px}
  .content{padding:16px 14px 90px}
  .g3,.g2{grid-template-columns:minmax(0,1fr)}
  .form{grid-template-columns:1fr}
  .donut-wrap{grid-template-columns:1fr;justify-items:center}
  .cal{gap:3px}.cal .day{min-height:66px;font-size:9.5px;padding:3px}.cal .ev{padding:0 3px}
  .quick{grid-template-columns:1fr 1fr}
  .quick .q-concept{grid-column:1/-1}
  .wiz-row{grid-template-columns:1fr 1fr}
  .wiz-row .wn{grid-column:1/-1}
  .search kbd{display:none}
  .ph h1{font-size:21px}
  .kpi .val{font-size:23px}
}
@media (max-width:540px){.g4{grid-template-columns:minmax(0,1fr)}.steps{grid-template-columns:1fr}.paper{padding:20px}.paper .boxes{grid-template-columns:1fr 1fr}}

/* Print */
@media print{
  @page{margin:14mm}
  body{background:#fff!important;color:#000}
  .side,.topbar,.fab,.fab-menu,.no-print,.toasts{display:none!important}
  .app{display:block}.content{padding:0;max-width:none}
  .panel,.paper{box-shadow:none;border-color:#ddd;break-inside:avoid}
  .paper{border:0;padding:0}
  body.priv *{filter:none!important}
}

/* Métodos de pago */
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:12px}
.mcard{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:14px;cursor:pointer;transition:border-color .12s,box-shadow .12s,transform .1s;color:inherit;font:inherit;display:flex;flex-direction:column}
.mcard:hover{border-color:var(--faint);transform:translateY(-1px)}
.mcard.on{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft);background:color-mix(in srgb,var(--primary-soft) 55%,var(--surface))}
.mcard .mi{font-size:24px;line-height:1}
.mcard .mv{font-size:20px;font-weight:700;margin-bottom:2px}
.mcard .pill{font-size:10.5px;padding:1px 7px}

/* =====================================================================
   CELULAR — barra inferior, tablas como tarjetas, hojas desde abajo
   ===================================================================== */
.tabbar{display:none}
.agenda{display:none}
@media (max-width:860px){
  /* Barra inferior */
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:40;
    background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:saturate(1.4) blur(12px);border-top:1px solid var(--line);
    padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
  .tabbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10.5px;font-weight:600;color:var(--muted);min-height:50px;border-radius:12px;position:relative;cursor:pointer;-webkit-tap-highlight-color:transparent}
  .tabbar button svg{width:22px;height:22px}
  .tabbar button.on{color:var(--primary)}
  .tabbar button.on::before{content:"";position:absolute;top:2px;width:22px;height:3px;border-radius:3px;background:var(--primary)}
  .tabbar .tab-add{align-self:center;justify-self:center;width:52px;height:52px;min-height:0;border-radius:16px;background:var(--primary);color:#fff;box-shadow:0 8px 20px rgba(48,86,211,.38);margin-top:-18px}
  .tabbar .tab-add svg{width:26px;height:26px}
  .tabbar .tb-badge{position:absolute;top:4px;left:calc(50% + 6px);min-width:17px;height:17px;padding:0 5px;border-radius:99px;background:var(--bad);color:#fff;font-size:10px;display:grid;place-items:center}
  .fab{display:none!important}
  .fab-menu{left:50%;right:auto;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));width:min(320px,calc(100vw - 24px))}
  .fab-menu.on{display:block!important;animation:none}
  .fab-menu button{min-height:46px;font-size:15px}
  .content{padding:14px 14px calc(96px + env(safe-area-inset-bottom))}
  .toasts{bottom:calc(84px + env(safe-area-inset-bottom));width:calc(100vw - 24px)}
  .toast{width:100%;justify-content:space-between}

  /* Barra superior compacta */
  .topbar{padding:8px 12px;padding-top:calc(8px + env(safe-area-inset-top));gap:6px}
  .topbar .btn.primary{display:none}
  .search{max-width:none}
  .menu-btn{display:none}
  .side{width:min(300px,86vw)}

  /* Encabezados y tarjetas */
  .ph{margin-bottom:14px;gap:10px}
  .ph h1{font-size:21px}
  .ph p{font-size:13px}
  .ph .row{width:100%}
  .ph .monthnav{flex:1 1 100%;justify-content:space-between}
  .ph .monthnav ~ .btn{flex:1 1 auto;justify-content:center}
  .panel > .hd{padding:14px 14px 0}
  .panel > .bd{padding:12px 14px 14px}
  .grid{gap:12px}
  .section{margin:22px 0 10px}

  /* Indicadores en 2 columnas */
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi{padding:12px}
  .kpi .lbl{font-size:11px;line-height:1.25}
  .kpi .ico{width:26px;height:26px;border-radius:8px}
  .kpi .ico svg{width:14px;height:14px}
  .kpi .val{font-size:clamp(17px,5.4vw,22px);margin:4px 0}
  .kpi .foot{font-size:11px;gap:4px}
  .kpi .foot .pill{font-size:10px;padding:1px 6px}

  /* Hero */
  .hero{padding:16px;gap:14px;border-radius:16px}
  .hero h2{font-size:18px}
  .hero p{font-size:13px}
  .hero .row .btn{flex:1;justify-content:center}

  /* Toque cómodo y sin zoom automático en iPhone */
  .btn{min-height:40px}
  .btn.sm{min-height:34px}
  .iconbtn{min-width:36px;min-height:36px}
  .fld input,.fld select,.fld textarea,.inp,.inl,.palette input,.qa textarea{font-size:16px}
  .inl{height:38px}
  .check{padding:12px;min-height:56px}
  .check .box{width:26px;height:26px}
  .seg{display:flex;width:100%}
  .seg button{flex:1;padding:8px 6px;font-size:12.5px}

  /* Tablas → tarjetas */
  .rt,.rt tbody,.rt tfoot,.rt tr,.rt td{display:block;width:100%}
  .rt thead{display:none}
  .rt tr{position:relative;padding:12px 14px;border-bottom:1px solid var(--line)}
  .rt tbody tr:last-child{border-bottom:0}
  .rt tbody tr:hover{background:none}
  .rt td{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:4px 0;border:0;text-align:right;min-height:30px}
  .rt td::before{content:attr(data-label);font-size:12px;color:var(--muted);font-weight:600;text-align:left;flex:none;max-width:55%}
  .rt td[data-label=""]::before{display:none}
  .rt td:first-child{display:block;text-align:left;padding-right:40px;margin-bottom:4px}
  .rt td:first-child::before{display:none}
  .rt td:last-child:has(> .iconbtn){position:absolute;top:8px;right:6px;width:auto;padding:0;min-height:0}
  .rt td[colspan]{display:block;text-align:center}
  .rt tr.grp{display:flex;justify-content:space-between;align-items:center;background:var(--surface-3);padding:8px 14px}
  .rt tr.grp td{width:auto;padding:0;min-height:0;background:none}
  .rt tr.grp td::before{display:none}
  .rt tfoot tr{background:var(--surface-2)}
  .rt tfoot td{background:none;border:0}
  .rt tfoot td:first-child{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
  .rt td:empty{display:none}
  .tbl{border-radius:14px}
  table.keep th,table.keep td{padding:8px 10px;font-size:12.5px}

  /* Métodos del plan en carrusel */
  .mgrid{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:80%;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 2px 10px;margin:0 -2px;-webkit-overflow-scrolling:touch}
  .mcard{scroll-snap-align:start}

  /* Calendario → agenda */
  .cal{display:none}
  .agenda{display:flex;flex-direction:column;gap:8px}
  .ag-day{display:flex;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
  .ag-day.today{border-color:var(--primary);box-shadow:0 0 0 2px var(--primary-soft)}
  .ag-n{width:42px;flex:none;text-align:center;display:flex;flex-direction:column}
  .ag-n b{font-size:20px;line-height:1.1}
  .ag-n span{font-size:11px;color:var(--muted);text-transform:uppercase}
  .ag-ev{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
  .ag-ev .ev{white-space:normal;font-size:13px;padding:4px 8px;border-radius:7px}

  /* Hojas que suben desde abajo */
  .modal{left:0;right:0;top:auto;bottom:0;transform:none;width:100%;max-height:92vh;border-radius:20px 20px 0 0;border-bottom:0}
  .modal.sm{width:100%}
  .modal.on{animation:sheet .22s ease-out}
  .modal::before{content:"";display:block;width:40px;height:4px;border-radius:4px;background:var(--line);margin:8px auto 0}
  .modal header{padding:10px 16px 12px}
  .modal .mb{padding:14px 16px}
  .modal footer{padding:12px 16px calc(12px + env(safe-area-inset-bottom));gap:8px}
  .modal footer > .row{flex:1;justify-content:flex-end}
  .modal footer .btn.primary{flex:1;justify-content:center}
  @keyframes sheet{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
  .drawer{width:100vw}
  .drawer > header{padding-top:calc(14px + env(safe-area-inset-top))}
  .palette{top:0;left:0;right:0;transform:none;width:100%;border-radius:0 0 18px 18px;padding-top:env(safe-area-inset-top)}
  .palette.on{animation:none}
  .palette .list{max-height:70vh}

  /* Otros */
  .quick{grid-template-columns:1fr 1fr}
  .quick .q-concept{grid-column:1/-1;order:-1}
  .quick .btn{grid-column:1/-1;justify-content:center}
  .toolbar{flex-direction:column;align-items:stretch}

<script>
/* =====================================================================
   NÚCLEO — cálculos puros, sin DOM. Se prueba aparte con Node.
   ===================================================================== */
(function (root) {
"use strict";

const VERSION = 2;
const FREQ = {"Semanal":52/12,"Catorcenal":26/12,"Quincenal":2,"Mensual":1,"Bimestral":1/2,"Trimestral":1/3,"Semestral":1/6,"Anual":1/12,"Única vez":0};
const MESES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const PERSONAS = ["Yo","Familia"];
const SINO = ["Sí","No"];
const CATS = {
  "Vivienda":"#3056d3","Servicios":"#0ea5e9","Alimentación":"#10b981","Transporte":"#f59e0b","Hijos":"#ec4899",
  "Salud":"#ef4444","Personal":"#8b5cf6","Educación":"#14b8a6","Impuestos":"#a16207","Bancos":"#64748b",
  "Mascotas":"#d97706","Familia":"#f97316","Negocios":"#0d9488","Otros":"#94a3b8"
};

let IVA = 0.16;
const setIva = v => { IVA = (v === "" || v == null || isNaN(+v)) ? 0.16 : +v; };
const getIva = () => IVA;

/* ---------- utilidades ---------- */
const num = v => (v === "" || v == null || isNaN(+v)) ? 0 : +v;
const has = v => !(v === "" || v == null || (typeof v === "number" && isNaN(v)));
const pad = n => String(n).padStart(2, "0");
const localISO = (d = new Date()) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const monthKey = iso => (iso || localISO()).slice(0, 7);
const addMonths = (k, n) => { const [y, m] = k.split("-").map(Number); const d = new Date(y, m - 1 + n, 1); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}`; };
const monthName = k => { const [y, m] = k.split("-"); return `${MESES[+m - 1]} ${y}`; };
const daysBetween = (a, b) => Math.round((new Date(b + "T00:00") - new Date(a + "T00:00")) / 864e5);
const fmtMXN = new Intl.NumberFormat("es-MX", {style:"currency", currency:"MXN", maximumFractionDigits:0});
const fm = v => { if (!has(v) || !isFinite(v)) return "—"; const n = Math.abs(v) < 0.5 ? 0 : v; return fmtMXN.format(n); };
const fp = (v, d = 0) => has(v) && isFinite(v) ? (v * 100).toFixed(d) + "%" : "—";
const fmtDate = iso => { if (!iso) return "—"; const [y, m, d] = iso.split("-"); return `${+d} ${MESES[+m - 1].slice(0, 3)} ${y.slice(2)}`; };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const fq = f => FREQ[f] ?? 0;
const DIAS_SEM = ["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
/* ---------- Sueldo bruto → neto (estimado) ----------
   Fuentes 2026 (revisar cada enero): tarifa mensual ISR del Anexo 8 RMF (DOF 28-dic-2025);
   subsidio para el empleo 15.02% de la UMA mensual = $535.65 si el ingreso no pasa de $11,492.66 (DOF 31-dic-2025);
   UMA 2026 $117.31 diarios; cuotas obreras IMSS (LSS): 0.25% + 0.375% + 0.625% + 1.125% del SBC y 0.40% de lo que pase de 3 UMA.
   SBC con prestaciones mínimas de ley: factor 1.0493 (aguinaldo 15 días + prima vacacional 25% de 12 días).
   Techo: no ve vales, fondo de ahorro, crédito Infonavit/FONACOT ni otras deducciones; el recibo de nómina manda. */
const ISR_MES = [[0.01, 0, .0192], [844.60, 16.22, .064], [7168.52, 420.95, .1088], [12598.03, 1011.68, .16], [14644.65, 1339.14, .1792],
  [17533.65, 1856.84, .2136], [35362.84, 5665.16, .2352], [55736.69, 10457.09, .30], [106410.51, 25659.23, .32], [141880.67, 37009.69, .34], [425642, 133488.54, .35]];
const SUBSIDIO = { monto:535.65, tope:11492.66 }, UMA_DIA = 117.31, FACTOR_SBC = 1.0493, DIAS_MES = 30.4;
function netoDeBruto(bruto) {
  bruto = num(bruto); if (bruto <= 0) return { bruto:0, isr:0, imss:0, neto:0 };
  const row = [...ISR_MES].reverse().find(r => bruto >= r[0]);
  const isrTarifa = row[1] + (bruto - row[0]) * row[2];
  const isr = Math.max(0, isrTarifa - (bruto <= SUBSIDIO.tope ? SUBSIDIO.monto : 0)); // el subsidio ya no se paga en efectivo
  const sbc = bruto / DIAS_MES * FACTOR_SBC;
  const imss = (sbc * (0.0025 + 0.00375 + 0.00625 + 0.01125) + Math.max(0, sbc - 3 * UMA_DIA) * 0.004) * DIAS_MES;
  const r2 = v => Math.round(v * 100) / 100;
  return { bruto, isr:r2(isr), imss:r2(imss), neto:r2(bruto - isr - imss) };
}
/* Cuántas veces cae un día de la semana en un mes: 4 o 5 (de ahí que el promedio semanal sea ×4.33) */
function weekdayCount(mk, diaSem) {
  const wd = DIAS_SEM.indexOf(diaSem); if (wd < 0) return null;
  const [y, m] = mk.split("-").map(Number), dim = new Date(y, m, 0).getDate();
  const first = (wd - new Date(y, m - 1, 1).getDay() + 7) % 7 + 1;
  return Math.floor((dim - first) / 7) + 1;
}
const sum = (arr, f) => arr.reduce((a, x) => a + f(x), 0);

/* ---------- cálculo por registro ---------- */
const C = {
  incMonthly: i => { const m = ((i.tipo === "Variable" && has(i.minimo)) ? num(i.minimo) : num(i.monto)) * fq(i.frecuencia || "Mensual"); return i.base === "Bruto" ? netoDeBruto(m).neto : m; },
  expMonthly: e => num(e.monto) * fq(e.frecuencia || "Mensual"),
  debtMonthly: d => num(d.pago) * fq(d.frecuencia || "Mensual"),
  rate: c => num(c.tasa) / 12 * (1 + IVA),
  rev: c => Math.max(0, num(c.saldo) - num(c.msiSaldo)),
  interest: c => C.rev(c) * C.rate(c),
  /* Regla Banxico (Circular 13/2011): el mayor entre (1.5% del saldo revolvente + intereses con IVA)
     y 1.25% del límite; nunca más que lo que se debe. Cada banco puede pedir más. */
  minEst: c => {
    const b = C.rev(c); if (b <= 0) return 0;
    const i = b * C.rate(c);
    return Math.min(b + i, Math.max(0.015 * b + i, 0.0125 * num(c.limite)));
  },
  minPay: c => has(c.pagoMin) ? num(c.pagoMin) : C.minEst(c) + num(c.msiMens),
  util: c => num(c.limite) > 0 && has(c.saldo) ? num(c.saldo) / num(c.limite) : null,
  nper(r, pmt, pv) {
    if (pv <= 0) return 0;
    if (pmt <= pv * r || pmt <= 0) return Infinity;
    if (r === 0) return pv / pmt;
    return -Math.log(1 - r * pv / pmt) / Math.log(1 + r);
  },
  payoff(c) {
    if (!has(c.pagoReal) || !has(c.saldo)) return null;
    const pmt = num(c.pagoReal) - num(c.msiMens), pv = C.rev(c), r = C.rate(c);
    const n = C.nper(r, pmt, pv);
    return { months: isFinite(n) ? Math.ceil(n) : Infinity, interest: isFinite(n) ? Math.max(0, pmt * n - pv) : Infinity };
  }
};

/* ---------- totales del hogar ---------- */
function totals(S) {
  const T = {};
  T.ing = sum(S.incomes, C.incMonthly);
  T.gFijo = sum(S.expenses.filter(e => e.tipo === "Fijo"), C.expMonthly);
  T.gVar = sum(S.expenses.filter(e => e.tipo !== "Fijo"), C.expMonthly);
  T.gastos = T.gFijo + T.gVar;
  T.esenciales = sum(S.expenses.filter(e => e.esencial === "Sí"), C.expMonthly);
  T.noEsenciales = T.gastos - T.esenciales;
  T.mins = sum(S.cards.filter(c => has(c.saldo)), C.minPay);
  T.cargosTDC = sum(S.cards, c => num(c.anualidad) / 12 + num(c.comisiones));
  T.pagoReal = sum(S.cards, c => num(c.pagoReal));
  T.noInt = sum(S.cards, c => num(c.pagoNoInt));
  T.otrasPagos = sum(S.debts.filter(d => d.nomina !== "Sí"), C.debtMonthly);
  T.egresos = T.gastos + T.mins + T.cargosTDC + T.otrasPagos;
  T.sobra = T.ing - T.egresos;
  T.tdc = sum(S.cards, c => num(c.saldo));
  T.lim = sum(S.cards, c => num(c.limite));
  T.uso = T.lim > 0 && T.tdc > 0 ? T.tdc / T.lim : null;
  T.intMes = sum(S.cards, C.interest);
  T.otras = sum(S.debts, d => num(d.saldo));
  T.ahorroInm = sum(S.savings.filter(s => s.disponibilidad === "Inmediata"), s => num(s.saldo));
  T.activos = sum(S.savings, s => num(s.saldo));
  T.colchon = T.esenciales > 0 && T.ahorroInm > 0 ? T.ahorroInm / T.esenciales : null;
  T.dti = T.ing > 0 && (T.mins + T.otrasPagos) > 0 ? (T.mins + T.otrasPagos) / T.ing : null;
  T.ahorroMes = sum(S.savings, s => num(s.aportacion));
  T.patrimonio = T.activos - T.tdc - T.otras;
  T.cardsConSaldo = S.cards.filter(c => has(c.saldo)).length;
  return T;
}

/* =====================================================================
   PLAN DE PAGO
   ===================================================================== */
const normOpts = o => typeof o === "boolean" ? { includeOther:o } : (o || {});
const rateOf = t => num(t) > 0 ? num(t) / 12 * (1 + IVA) : 0;

/* ---------- bolsa de deudas que entran al plan ----------
   source "auto": tarjetas (sin la parte a MSI) + otras deudas fuera de nómina si includeOther.
   source "scratch": la lista libre del escenario «desde cero» (S.scratch.debts). */
function pool(S, opts = {}) {
  const o = normOpts(opts);
  if (o.source === "scratch") {
    return ((S.scratch && S.scratch.debts) || []).filter(x => num(x.saldo) > 0.5).map(x => {
      const card = x.tipo === "Tarjeta" && !has(x.minimo);
      return { id:x.id, nombre:x.nombre || "Deuda", kind:card ? "card" : "debt", bal:num(x.saldo), r:rateOf(x.tasa), tasa:num(x.tasa),
        limite:num(x.limite), msi:0, msiM:0, fixed:num(x.minimo), emo:num(x.emocional) || 3 };
    });
  }
  const p = S.cards.filter(c => C.rev(c) > 0.5).map(c => ({
    id:c.id, nombre:c.nombre, kind:"card", bal:C.rev(c), r:C.rate(c), tasa:num(c.tasa), limite:num(c.limite),
    msi:num(c.msiSaldo), msiM:num(c.msiMens), fixed:0, emo:num(c.emocional) || 3 }));
  if (o.includeOther) for (const d of S.debts) {
    if (d.nomina === "Sí" || num(d.saldo) <= 0.5) continue;
    p.push({ id:d.id, nombre:d.acreedor, kind:"debt", bal:num(d.saldo), r:rateOf(d.tasa), tasa:num(d.tasa), limite:0, msi:0, msiM:0,
      fixed:C.debtMonthly(d), emo:num(d.emocional) || (d.tipo === "Préstamo de familia" ? 5 : 3) });
  }
  return p;
}

/* Mínimo de un renglón en un mes: Banxico en tarjetas (si no hay mínimo pactado), pago pactado en préstamos */
const minOf = c => c.kind === "card"
  ? Math.min(c.bal, Math.max(0.015 * (c.bal - c.lastI) + c.lastI, 0.0125 * c.limite))
  : Math.min(c.bal, c.fixed);
const firstMin = c => { const i = c.bal * c.r; return c.kind === "card" ? Math.min(c.bal + i, Math.max(0.015 * c.bal + i, 0.0125 * c.limite)) : Math.min(c.bal, c.fixed); };

/* ---------- métodos de pago ----------
   Todos pagan los mínimos de todo; difieren en a qué deuda mandan el excedente. */
const METHODS = {
  avalanche:{ name:"Avalancha", icon:"🏔️", short:"La tasa más alta primero",
    prio:(a, b) => b.r - a.r || a.bal0 - b.bal0 },
  snowball:{ name:"Bola de nieve", icon:"❄️", short:"La deuda más chica primero",
    prio:(a, b) => a.bal0 - b.bal0 || b.r - a.r },
  tsunami:{ name:"Tsunami", icon:"🌊", short:"La que más angustia primero",
    prio:(a, b) => b.emo - a.emo || a.bal0 - b.bal0 },
  fireball:{ name:"Bola de fuego", icon:"🔥", short:"Deudas «malas» de la más chica a la más grande",
    prio:(a, b, o) => { const u = o.umbral ?? 0.07, A = a.tasa >= u, B = b.tasa >= u; return (B - A) || (A ? a.bal0 - b.bal0 : b.r - a.r); } },
  cfi:{ name:"Índice de flujo", icon:"💧", short:"Saldo ÷ mínimo más bajo primero",
    prio:(a, b) => a.cfi - b.cfi || b.r - a.r }
};

/* ---------- motor: simula una bolsa de deudas mes por mes ----------
   Cada mes: intereses + IVA → mensualidades MSI → mínimos → excedente al objetivo, con efecto cascada.
   Un renglón puede traer rFn(mes) para tasas que cambian (transferencia con promoción). */
function simulatePool(base, method, budget, opts = {}) {
  const items = base.map(d => { const x = { ...d, bal0:d.bal, paidMonth:null, interest:0, lastI:0 }; x.min0 = firstMin(x); x.cfi = x.min0 > 0 ? x.bal0 / x.min0 : Infinity; return x; });
  if (!items.length) return null;
  const minsOnly = method === "minimos";
  const M = METHODS[method] || METHODS.avalanche;
  const sortNow = () => [...items].sort((a, b) => M.prio(a, b, opts));
  const dynamic = items.some(c => c.rFn);
  let order = sortNow();
  const total = () => sum(items, c => Math.max(0, c.bal));
  let month = 0, totalInt = 0, short = false;
  const series = [total()], schedule = [];
  while (items.some(c => c.bal > 0.5) && month < 600) {
    month++;
    let avail = budget, mInt = 0;
    const pays = {};
    const add = (c, p) => { pays[c.id] = (pays[c.id] || 0) + p; };
    for (const c of items) {
      if (c.rFn) c.r = c.rFn(month);
      if (c.bal <= 0) continue;
      const i = c.bal * c.r; c.bal += i; c.interest += i; totalInt += i; mInt += i; c.lastI = i;
    }
    if (dynamic) order = sortNow();
    for (const c of items) {
      if (c.msi > 0) { const p = Math.min(c.msi, c.msiM || c.msi); c.msi -= p; if (!minsOnly) avail -= p; add(c, p); }
    }
    for (const c of items) {
      if (c.bal <= 0) continue;
      const m = minOf(c);
      const p = minsOnly ? m : Math.max(0, Math.min(m, avail));
      if (!minsOnly && p < m - 0.5) short = true;
      c.bal -= p; if (!minsOnly) avail -= p; if (p > 0) add(c, p);
    }
    if (!minsOnly) {
      for (const c of order) {
        if (avail <= 0.5) break;
        if (c.bal <= 0.5) continue;
        const p = Math.min(c.bal, avail); c.bal -= p; avail -= p; add(c, p);
      }
    }
    for (const c of items) if (c.bal <= 0.5 && c.paidMonth === null) { c.bal = 0; c.paidMonth = month; }
    series.push(total());
    if (month <= 60) schedule.push({ month, pays, interest:mInt, total:series[series.length - 1],
      bals:Object.fromEntries(items.map(c => [c.id, Math.max(0, c.bal)])) });
  }
  const done = !items.some(c => c.bal > 0.5);
  return { method, months: done ? month : Infinity, totalInt: done ? totalInt : Infinity, cards:items,
    order: method === "minimos" ? items : [...items].sort((a, b) => (METHODS[method] || METHODS.avalanche).prio(a, b, opts)),
    series, schedule, short };
}

function simulate(S, method, budget, opts = {}) {
  const o = normOpts(opts);
  return simulatePool(pool(S, o), method, budget, o);
}

/* Lo mínimo que exige el primer mes */
function minBudget(S, opts = {}) {
  return sum(pool(S, normOpts(opts)), c => firstMin(c) + c.msiM);
}

/* Pago mensual mínimo para liquidar en «months» meses (búsqueda binaria, redondeado a $10) */
function budgetForMonths(S, method, months, opts = {}) {
  const o = normOpts(opts), P = pool(S, o);
  if (!P.length || !(months >= 1)) return null;
  const fits = b => { const r = simulatePool(P, method, b, o); return r && !r.short && r.months <= months; };
  let lo = Math.max(1, minBudget(S, o)), hi = sum(P, c => c.bal * (1 + c.r) + c.msi) + 10;
  if (fits(lo)) return Math.ceil(lo / 10) * 10;
  for (let i = 0; i < 50 && hi - lo > 1; i++) { const mid = (lo + hi) / 2; if (fits(mid)) hi = mid; else lo = mid; }
  return Math.ceil(hi / 10) * 10;
}

/* ---------- préstamo (pago fijo) ---------- */
function loan({ principal, tasa, plazo, comision = 0 }) {
  const P = num(principal), n = Math.max(1, Math.round(num(plazo))), r = rateOf(tasa);
  if (P <= 0) return null;
  const pmt = r > 0 ? P * r / (1 - Math.pow(1 + r, -n)) : P / n;
  const interest = pmt * n - P, fee = P * num(comision);
  return { pmt, months:n, interest, fee, cost: interest + fee };
}

/* ---------- consolidación: un préstamo paga todo; si sobra presupuesto, se adelanta (prepago) ---------- */
function consolidate(S, opts, params, budget) {
  const P = pool(S, normOpts(opts)); if (!P.length) return null;
  const principal = sum(P, c => c.bal + c.msi), l = loan({ principal, ...params });
  if (!l) return null;
  const r = simulatePool([{ id:"consol", nombre:"Préstamo de consolidación", kind:"debt", bal:principal, r:rateOf(params.tasa), tasa:num(params.tasa),
    limite:0, msi:0, msiM:0, fixed:l.pmt, emo:3 }], "avalanche", Math.max(budget, 0), {});
  return { ...r, method:"consolidacion", totalInt:r.totalInt + l.fee, fee:l.fee, pmt:l.pmt, principal, plazo:l.months };
}

/* ---------- transferencia de saldo: lo más caro pasa a una tarjeta con tasa de promoción ---------- */
function transfer(S, opts, { promo = 0, meses = 12, despues = 0.45, comision = 0.03, limite = 0 }, budget) {
  const P = pool(S, normOpts(opts)); if (!P.length) return null;
  let room = num(limite) > 0 ? num(limite) : Infinity, moved = 0;
  const rest = [];
  for (const c of [...P].sort((a, b) => b.r - a.r)) {
    const take = c.kind === "card" && c.tasa > num(promo) ? Math.min(c.bal, room) : 0;
    moved += take; room -= take;
    if (c.bal - take > 0.5) rest.push({ ...c, bal:c.bal - take });
    else if (c.msi > 0) rest.push({ ...c, bal:0 });
  }
  if (moved <= 0) return null;
  const pr = rateOf(promo), dr = rateOf(despues), fee = moved * num(comision);
  const tr = { id:"transfer", nombre:"Tarjeta de transferencia", kind:"card", bal:moved + fee, r:pr, tasa:num(promo), limite:num(limite) || moved,
    msi:0, msiM:0, fixed:0, emo:3, rFn:m => m <= meses ? pr : dr };
  const r = simulatePool([tr, ...rest], "avalanche", budget, {});
  return { ...r, method:"transferencia", moved, fee };
}

/* ---------- flujo: de dónde sale el dinero para pagar deudas ----------
   Ingresos − gastos fijos − gastos variables − cargos fijos de tarjetas − pagos de deudas que NO entran al plan
   = disponible; menos la reserva para colchón = lo que va al plan cada mes. */
function flujo(S, opts = {}) {
  const o = normOpts(opts), T = totals(S);
  const inPlan = new Set(pool(S, o).filter(c => c.kind === "debt").map(c => c.id));
  const fuera = sum(S.debts.filter(d => d.nomina !== "Sí" && !inPlan.has(d.id)), C.debtMonthly);
  const disponible = T.ing - T.gFijo - T.gVar - T.cargosTDC - fuera;
  const pct = Math.min(0.9, Math.max(0, num(o.reserva)));
  const reserva = Math.max(0, disponible) * pct;
  return { ing:T.ing, gFijo:T.gFijo, gVar:T.gVar, cargos:T.cargosTDC, fuera, disponible, reservaPct:pct, reserva, paraDeudas:Math.max(0, disponible - reserva) };
}

/* ---------- quincenas: lo que entra y sale en cada mitad del mes ---------- */
function quincenas(S, cardPays = {}) {
  const Q = [{ in:0, out:0, items:[] }, { in:0, out:0, items:[] }];
  const put = (day, amt, kind, name, dir) => {
    if (!amt) return;
    if (has(day)) { const q = +day <= 15 ? 0 : 1; Q[q][dir] += amt; Q[q].items.push({ day:+day, amt, kind, name, dir }); }
    else for (const q of Q) { q[dir] += amt / 2; q.items.push({ day:null, amt:amt / 2, kind, name, dir }); }
  };
  for (const i of S.incomes) { const m = C.incMonthly(i); if (m) put(fq(i.frecuencia) > 1 ? null : i.dia, m, "income", i.fuente, "in"); }
  for (const e of S.expenses) { const m = C.expMonthly(e); if (m) put(fq(e.frecuencia) > 1 ? null : e.dia, m, "expense", e.concepto, "out"); }
  for (const c of S.cards) {
    const p = cardPays[c.id] ?? (has(c.pagoReal) ? num(c.pagoReal) : (has(c.saldo) ? C.minPay(c) : 0));
    put(c.diaPago, p, "card", c.nombre, "out");
  }
  for (const d of S.debts) if (d.nomina !== "Sí") put(d.dia, C.debtMonthly(d), "debt", d.acreedor, "out");
  for (const q of Q) q.items.sort((a, b) => (a.day ?? 99) - (b.day ?? 99) || b.amt - a.amt);
  return Q;
}

/* ---------- pagos con fecha del mes (para la checklist) ---------- */
function monthItems(S, mk, cardPays = {}) {
  const items = [], mes = MESES[+mk.slice(5) - 1];
  const last = new Date(+mk.slice(0, 4), +mk.slice(5), 0).getDate();
  const day = d => has(d) ? Math.min(+d, last) : null;
  for (const c of S.cards) {
    if (has(c.saldo) && num(c.saldo) <= 0) continue;
    if (!has(c.saldo) && (!has(c.diaPago) || !has(c.pagoReal))) continue;
    const amt = cardPays[c.id] ?? (has(c.pagoReal) ? num(c.pagoReal) : has(c.saldo) ? C.minPay(c) : null);
    items.push({ key:`card:${c.id}`, kind:"card", id:c.id, name:c.nombre, day:day(c.diaPago), amt });
  }
  for (const e of S.expenses) {
    if (!has(e.monto)) continue;
    const f = fq(e.frecuencia);
    if (f >= 1 && f <= 2 && has(e.dia)) {
      items.push({ key:`exp:${e.id}`, kind:"expense", id:e.id, name:e.concepto, day:day(e.dia), amt:num(e.monto), cat:e.categoria });
      if (e.frecuencia === "Quincenal") items.push({ key:`exp:${e.id}:2`, kind:"expense", id:e.id, name:e.concepto + " (2ª)", day:day(+e.dia + 15 > last ? last : +e.dia + 15), amt:num(e.monto), cat:e.categoria });
    } else if (f < 1 && f > 0 && e.mes === mes) {
      items.push({ key:`exp:${e.id}`, kind:"expense", id:e.id, name:e.concepto, day:day(e.dia), amt:num(e.monto), cat:e.categoria });
    }
  }
  for (const d of S.debts) {
    if (d.nomina === "Sí" || (!has(d.pago) && !cardPays[d.id])) continue;
    items.push({ key:`debt:${d.id}`, kind:"debt", id:d.id, name:d.acreedor, day:day(d.dia), amt:cardPays[d.id] ?? num(d.pago) });
  }
  const paid = (S.paid || {})[mk] || {};
  for (const it of items) it.paid = !!paid[it.key];
  return items.sort((a, b) => (a.day ?? 99) - (b.day ?? 99));
}

/* ---------- próximo vencimiento de un día del mes ---------- */
function nextDue(day, today = new Date()) {
  if (!has(day)) return null;
  const t = new Date(today); t.setHours(0, 0, 0, 0);
  const lastOf = (y, m) => new Date(y, m + 1, 0).getDate();
  let d = new Date(t.getFullYear(), t.getMonth(), Math.min(+day, lastOf(t.getFullYear(), t.getMonth())));
  if (d < t) d = new Date(t.getFullYear(), t.getMonth() + 1, Math.min(+day, lastOf(t.getFullYear(), t.getMonth() + 1)));
  return { date:d, days:Math.round((d - t) / 864e5) };
}

/* ---------- avisos ---------- */
function alerts(S, T, today = new Date()) {
  const A = [];
  if (T.ing > 0 && T.sobra < 0) A.push({ tone:"bad", icon:"⛔", title:"No alcanza ni para los mínimos", text:`Faltan ${fm(-T.sobra)} al mes. Lo primero es recortar lo no esencial.` });
  for (const d of S.debts) if (d.estado === "Atrasado") A.push({ tone:"bad", icon:"⚠️", title:`${d.acreedor}: atrasado`, text:"Ponerlo al corriente va antes que adelantar cualquier otra deuda." });
  const mk = monthKey(localISO(today)), paid = (S.paid || {})[mk] || {};
  for (const c of S.cards) {
    const due = nextDue(c.diaPago, today);
    if (due && due.days <= 5 && has(c.saldo) && num(c.saldo) > 0 && !paid[`card:${c.id}`])
      A.push({ tone:"warn", icon:"⏰", title:`${c.nombre}: ${due.days === 0 ? "el pago vence hoy" : `pago en ${due.days} ${due.days === 1 ? "día" : "días"}`}`,
        text:`Para no generar intereses: ${fm(c.pagoNoInt)} · mínimo: ${fm(C.minPay(c))}` });
    if (has(c.pagoReal) && has(c.saldo) && C.rev(c) > 0 && num(c.pagoReal) - num(c.msiMens) <= C.interest(c))
      A.push({ tone:"bad", icon:"🔁", title:`${c.nombre}: el pago no cubre ni los intereses`, text:`Intereses + IVA: ${fm(C.interest(c))} al mes. La deuda crece aunque paguen.` });
    const u = C.util(c);
    if (u !== null && u >= 0.9) A.push({ tone:"bad", icon:"📈", title:`${c.nombre} está al ${fp(u)} de su límite`, text:"Arriba de 90% pega en el historial y deja sin margen para emergencias." });
    if (c.enUso === "Sí" && num(c.tasa) >= 0.6 && C.rev(c) > 0) A.push({ tone:"warn", icon:"✂️", title:`${c.nombre}: tasa de ${fp(c.tasa, 1)} y la siguen usando`, text:"Cada compra nueva aquí es la más cara de la casa." });
    if (c.fechaEdo && daysBetween(c.fechaEdo, localISO(today)) > 35) A.push({ tone:"info", icon:"📄", title:`${c.nombre}: estado de cuenta viejo`, text:`Es del ${fmtDate(c.fechaEdo)}. Registra el más reciente.` });
  }
  if (T.esenciales > 0 && T.colchon === null) A.push({ tone:"info", icon:"🛟", title:"Sin colchón registrado", text:`Meta de arranque: un mes de gastos esenciales (${fm(T.esenciales)}).` });
  const sinSaldo = S.cards.filter(c => !has(c.saldo)).length;
  if (sinSaldo) A.push({ tone:"info", icon:"✍️", title:`Faltan saldos de ${sinSaldo} tarjeta${sinSaldo > 1 ? "s" : ""}`, text:"Con el saldo al corte se prenden el resumen y el plan." });
  const order = { bad:0, warn:1, info:2, good:3 };
  A.sort((a, b) => order[a.tone] - order[b.tone]);
  if (!A.length) A.push({ tone:"good", icon:"✅", title:"Todo en orden", text:"Sin pagos próximos ni focos rojos." });
  return A;
}

/* ---------- logros ---------- */
function achievements(S, T) {
  const base = S.settings.baseline;
  const prog = base && base.tdc > 0 ? Math.max(0, (base.tdc - T.tdc) / base.tdc) : 0;
  const filled = ["cards", "debts", "incomes", "expenses", "savings"].every(k => S[k].some(r => has(r.saldo) || has(r.monto)));
  const zeroCard = base && S.cards.some(c => has(c.saldo) && num(c.saldo) === 0 && num(base.cards?.[c.id]) > 0);
  const anyPaid = Object.values(S.paid || {}).some(m => Object.keys(m).length);
  const monthDone = Object.keys(S.paid || {}).some(mk => { const it = monthItems(S, mk); return it.length > 0 && it.every(i => i.paid); });
  return [
    { icon:"🗺️", name:"Mapa completo", desc:"Todas las secciones con datos", ok:filled },
    { icon:"📸", name:"Punto de partida", desc:"Deuda inicial fijada", ok:!!base },
    { icon:"☑️", name:"Primer pago palomeado", desc:"Marcaste un pago en «Este mes»", ok:anyPaid },
    { icon:"📅", name:"Mes impecable", desc:"Todos los pagos de un mes palomeados", ok:monthDone },
    { icon:"🛟", name:"Colchón de 1 mes", desc:"Ahorro inmediato ≥ 1 mes de esenciales", ok:(T.colchon ?? 0) >= 1 },
    { icon:"🏰", name:"Colchón de 3 meses", desc:"La meta de Condusef", ok:(T.colchon ?? 0) >= 3 },
    { icon:"✂️", name:"Primera tarjeta en cero", desc:"Una tarjeta que debía, ya en $0", ok:!!zeroCard },
    { icon:"🥉", name:"25% liquidado", desc:"De la deuda inicial", ok:prog >= .25 },
    { icon:"🥈", name:"50% liquidado", desc:"La mitad del camino", ok:prog >= .5 },
    { icon:"🥇", name:"75% liquidado", desc:"Ya casi", ok:prog >= .75 },
    { icon:"🐉", name:"Boss derrotado", desc:"Cero deuda en tarjetas", ok:!!base && base.tdc > 0 && T.tdc === 0 }
  ];
}

/* ---------- foto diaria de saldos (para la gráfica de avance) ---------- */
function autoSnapshot(S, T = totals(S)) {
  if (!T.cardsConSaldo) return false;
  const today = localISO(), last = S.snapshots[S.snapshots.length - 1];
  const cards = Object.fromEntries(S.cards.map(c => [c.id, num(c.saldo)]));
  let changed = true;
  if (last && last.date === today) Object.assign(last, { tdc:T.tdc, otras:T.otras, cards });
  else if (last && Math.abs(last.tdc - T.tdc) < 1) changed = false;
  else S.snapshots.push({ date:today, tdc:T.tdc, otras:T.otras, cards });
  // Punto de partida automático: la primera vez que todas las tarjetas con límite tienen saldo
  if (!S.settings.baseline && S.cards.filter(c => num(c.limite) > 0).every(c => has(c.saldo)))
    S.settings.baseline = { date:today, tdc:T.tdc, cards };
  return changed;
}

      hogarNombre:"Mis cuentas", hogarDetalle:"", personas:[...PERSONAS], lastBackup:"" },

      exp("Alimentación","Mandado de la semana",V,S_,"Semanal"), exp("Alimentación","Tortillas, pan, fruta y verdura",V,S_,"Semanal"),

/* ---------- migración de versiones anteriores ---------- */
function migrate(d) {
  const base = seed();
  for (const k of Object.keys(base)) if (d[k] === undefined) d[k] = base[k];
  d.settings = { ...base.settings, ...d.settings };
  for (const c of d.cards) if (!Array.isArray(c.history)) c.history = [];

   Un evento por pago con día, que se repite (mensual, quincenal o anual, igual que «Este mes»),

  const lastOf = (yy, mm) => new Date(yy, mm, 0).getDate();
  const byDay = dd => dd <= 28 ? `BYMONTHDAY=${dd}` : `BYMONTHDAY=${Array.from({ length:dd - 27 }, (_, i) => 28 + i).join(",")};BYSETPOS=-1`;
  const ev = [];

    let yy = y, mm = mes || m;
    if (mes) { if (mes < m || (mes === m && Math.min(dia, lastOf(yy, mm)) < d)) yy++; }
    else if (Math.min(dia, lastOf(yy, mm)) < d) { mm++; if (mm > 12) { mm = 1; yy++; } }
    vev(uidk, ymd(yy, mm, Math.min(dia, lastOf(yy, mm))), `RRULE:FREQ=${mes ? `YEARLY;BYMONTH=${mes}` : "MONTHLY"};${byDay(dia)}`,
      title, `${has(amt) && num(amt) > 0 ? `Aprox. ${fm(amt)}. ` : ""}Al pagarlo, palomealo en la app.`);
  };
  const vev = (uidk, start, rrule, title, desc) => ev.push(["BEGIN:VEVENT", `UID:${uidk}@mis-pagos`, `DTSTAMP:${ymd(y, m, d)}T000000Z`,
    `DTSTART;VALUE=DATE:${start}`, ...(rrule ? [rrule] : []), `SUMMARY:${tx(title)}`, `DESCRIPTION:${tx(desc)}`, "TRANSP:TRANSPARENT",
    "BEGIN:VALARM", "ACTION:DISPLAY", `DESCRIPTION:${tx(title)}`, "TRIGGER:-PT15H", "END:VALARM", "END:VEVENT"].join("\r\n"));
  for (const c of S.cards) if (has(c.diaPago) && !(has(c.saldo) && num(c.saldo) <= 0)) add(`card-${c.id}`, `💳 Pagar ${c.nombre}`, c.diaPago, has(c.pagoReal) ? c.pagoReal : has(c.saldo) ? C.minPay(c) : "");
  for (const e of S.expenses) {
    if (!has(e.monto) || !has(e.dia)) continue;
    const f = fq(e.frecuencia);
    if (f >= 1 && f <= 2) {
      add(`exp-${e.id}`, `📅 ${e.concepto}`, e.dia, e.monto);
      if (e.frecuencia === "Quincenal") add(`exp-${e.id}-2`, `📅 ${e.concepto} (2ª)`, Math.min(31, +e.dia + 15), e.monto);
    } else if (f > 0 && f < 1 && MESES.includes(e.mes)) add(`exp-${e.id}`, `📅 ${e.concepto}`, e.dia, e.monto, MESES.indexOf(e.mes) + 1);
  }
  for (const x of S.debts) if (x.nomina !== "Sí" && has(x.pago) && has(x.dia)) add(`debt-${x.id}`, `🧾 Pagar ${x.acreedor}`, x.dia, x.pago);
  for (const c of S.cobros || []) {
    const saldo = num(c.monto) - sum(c.abonos || [], a => num(a.monto));
    if (c.liquidado || saldo <= 0 || !c.compromiso || c.compromiso < hoy) continue;
    vev(`cobro-${c.id}`, c.compromiso.replace(/-/g, ""), "", `💰 Cobrar a ${c.persona || "alguien"}${c.concepto ? `: ${c.concepto}` : ""}`, `Le falta pagarte ${fm(saldo)}. Quedó de pagarte este día.`);
  }
  const text = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Mis pagos//ES", "CALSCALE:GREGORIAN", "X-WR-CALNAME:Pagos", ...ev, "END:VCALENDAR", ""].join("\r\n");
  return { text, count:ev.length };
}

/* ---------- Para el día a día: gastos variables del presupuesto contra lo anotado en Movimientos este mes ---------- */
function libre(S, hoy) {
  const mk = hoy.slice(0, 7), [y, m, d] = hoy.split("-").map(Number), dias = new Date(y, m, 0).getDate() - d + 1;

function rowMonthly(col, r) {
  const m = col === "incomes" ? C.incMonthly(r) : C.expMonthly(r), f = r.frecuencia;
  const brutoTxt = (() => {
    if (col !== "incomes" || r.base !== "Bruto" || !m) return "";
    const b = ((r.tipo === "Variable" && has(r.minimo)) ? num(r.minimo) : num(r.monto)) * fq(f || "Mensual"), n = K.netoDeBruto(b);
    return `<div class="cell-sub freq-hint">Neto estimado: bruto ${fm(b)} − ISR ${fm(n.isr)} − IMSS ${fm(n.imss)}. Tu recibo manda.</div>`;
  })();
  if (!m || (f !== "Semanal" && f !== "Catorcenal")) return brutoTxt ? `<div>${fm(m)}${brutoTxt}</div>` : fm(m || "");
  const per = col === "incomes" && r.tipo === "Variable" && has(r.minimo) ? num(r.minimo) : num(r.monto);
  const mk = monthKey(), mes = MESES[+mk.slice(5) - 1], n = f === "Semanal" ? K.weekdayCount(mk, r.diaSem) : null;
  const hint = f === "Catorcenal" ? `Promedio (2.17 pagos al mes): hay meses de 2 pagos (${fm(per * 2)}) y de 3 (${fm(per * 3)})`
    : n ? `Promedio (4.33 semanas al mes). En ${mes} caen <b>${n} ${/s$/.test(r.diaSem) ? r.diaSem : r.diaSem + "s"}</b>: ${fm(per * n)}`
    : `Promedio (4.33 semanas al mes): hay meses de 4 pagos (${fm(per * 4)}) y de 5 (${fm(per * 5)})`;
  return `<div>${fm(m)}<div class="cell-sub freq-hint">${hint}</div>${brutoTxt}</div>`;
}

let S, fileHandle = null, fileOk = false, saveTimer = null, view = "resumen", lastDeleted = null, focusAfter = null;

function load() {
  try { const raw = localStorage.getItem(LS_KEY); if (raw) { S = K.migrate(JSON.parse(raw)); K.setIva(S.settings.iva); return; } } catch (e) { console.warn(e); }
  S = K.seed(); K.setIva(S.settings.iva); persist({ silent:true, fresh:true });
}
function persist({ silent = false, fresh = false } = {}) {
  S.updated = new Date().toISOString();
  K.autoSnapshot(S); K.autoHist(S);
  try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch (e) { toast("No se pudo guardar en el navegador"); }
  backupRotate();
  if (!fresh) syMark(); // datos iniciales recién creados: no compiten con los de la nube
  if (fileHandle && fileOk) { clearTimeout(saveTimer); saveTimer = setTimeout(writeFile, 500); }
  if (!silent) { renderSide(); }
}
/* Respaldo automático: una copia por hora, se guardan las últimas 12 */
function backupRotate() {
  try {
    const list = JSON.parse(localStorage.getItem(BK_KEY) || "[]");
    const lastT = list[0] ? new Date(list[0].t).getTime() : 0;
    if (Date.now() - lastT < 36e5) return;
    list.unshift({ t:new Date().toISOString(), data:JSON.stringify(S) });
    localStorage.setItem(BK_KEY, JSON.stringify(list.slice(0, 12)));
  } catch (e) { /* sin espacio: se omite */ }
}
const backups = () => { try { return JSON.parse(localStorage.getItem(BK_KEY) || "[]"); } catch (e) { return []; } };
/* ---------- Sincronización entre aparatos (cifrada, Gist secreto) ---------- */
const SY_KEY = "mis-cuentas-sync";
const DEVICE = /Android|iPhone|iPad|Mobile/i.test(navigator.userAgent) ? "celular" : "computadora";
// SY = { token, pass, gistId, rev, salt, dirty, last, err }: vive solo en este aparato
let SY = (() => { try { return JSON.parse(localStorage.getItem(SY_KEY)) || {}; } catch (e) { return {}; } })();
let syBusy = null, syTimer = null;
const syncOn = () => !!(SY.token && SY.pass && SY.gistId);
const cryptoOk = () => !!globalThis.crypto?.subtle;
function sySave() { try { localStorage.setItem(SY_KEY, JSON.stringify(SY)); } catch (e) { /* sin espacio */ } }
function syMark() { if (!syncOn()) return; SY.dirty = true; sySave(); clearTimeout(syTimer); syTimer = setTimeout(() => sync(), 4000); }
/* Guarda una versión en «Respaldos automáticos» aunque no haya pasado la hora */
function stashBackup(data, note) {
  try {
    const list = backups(); list.unshift({ t:new Date().toISOString(), data:typeof data === "string" ? data : JSON.stringify(data), note });
    localStorage.setItem(BK_KEY, JSON.stringify(list.slice(0, 12)));
  } catch (e) { /* sin espacio: se omite */ }
}
function applyRemote(data) {
  S = K.migrate(data); K.setIva(S.settings.iva);
  try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch (e) { toast("No se pudo guardar en el navegador"); }
  if (fileHandle && fileOk) writeFile();
}
async function syPush(gh) {
  const rev = uid(), wasDirty = SY.dirty;
  SY.dirty = false; // si editan mientras sube, persist() lo vuelve a marcar
  try {
    const blob = await K.seal(S, SY.pass, { salt:SY.salt, rev, updated:S.updated, device:DEVICE });
    await gh.put(SY.gistId, blob);
    SY.rev = rev; SY.salt = blob.kdf.salt;
  } catch (e) { SY.dirty = SY.dirty || wasDirty; throw e; }
}
const whenTxt = iso => iso ? new Date(iso).toLocaleString("es-MX", { dateStyle:"medium", timeStyle:"short" }) : "—";
function sync({ manual = false } = {}) {
  if (!syncOn() || !cryptoOk()) return Promise.resolve();
  if (syBusy) return syBusy;
  syBusy = (async () => {
    renderSyncBtn(true);
    try {
      if (navigator.onLine === false) throw Object.assign(new Error("Sin internet: se sube al reconectar"), { code:"net" });
      const gh = K.gist(SY.token), remote = await gh.get(SY.gistId);
      const act = K.syncDecide({ remoteRev:remote?.rev ?? null, lastRev:SY.rev ?? null, dirty:!!SY.dirty });
      if (act === "push") await syPush(gh);
      else if (act === "pull" || act === "conflict") {
        const data = await K.unseal(remote, SY.pass), from = `${remote.device || "otro aparato"} (${whenTxt(remote.updated)})`;
        const takeRemote = act === "pull" || confirm(`Hay cambios en este aparato y también en ${from}.\n\nAceptar = quedarte con los de ${remote.device || "la nube"}.\nCancelar = quedarte con los de este aparato.\n\nLa versión que no elijas se guarda en «Respaldos automáticos».`);
        if (takeRemote) {
          if (act === "conflict") stashBackup(S, "Cambios de este aparato antes de sincronizar");
          applyRemote(data); SY.rev = remote.rev; SY.salt = remote.kdf.salt; SY.dirty = false;
          render({ keepScroll:true }); if (act === "pull" && SY.last) toast(`Datos al día con ${remote.device || "la nube"}`);
        } else { stashBackup(data, `Versión de ${remote.device || "la nube"} que no se eligió`); SY.salt = remote.kdf.salt; await syPush(gh); }
      }
      await syncApp(gh);
      SY.last = new Date().toISOString(); SY.err = "";
      if (manual) toast("Sincronizado ✓");
    } catch (e) {
      SY.err = e.message;
      if (manual || e.code === 401 || e.code === "pass") toast(e.message);
    } finally { sySave(); }
  })().finally(() => { syBusy = null; renderSide(); });
  return syBusy;
}
/* La computadora (app abierta desde archivo) sube la app cifrada a su propio Gist; el celular la baja con el cargador */
async function syncApp(gh) {
  if (location.protocol !== "file:") return;
  const hash = [...new Uint8Array(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(APP_SRC)))].slice(0, 8).map(b => b.toString(16).padStart(2, "0")).join("");
  if (SY.appHash === hash) return;
  const blob = await K.seal(APP_SRC, SY.pass, { salt:SY.salt, hash, updated:new Date().toISOString() });
  if (!SY.appGistId) SY.appGistId = await gh.find(K.APP_FILE);
  if (SY.appGistId) await gh.put(SY.appGistId, blob, K.APP_FILE); else SY.appGistId = await gh.create(blob, K.APP_FILE);
  SY.appHash = hash;
}
async function syncConnect(token, pass) {
  const gh = K.gist(token), id = await gh.find();
  if (id) {
    const remote = await gh.get(id);
    if (remote) await K.unseal(remote, pass); // valida la contraseña antes de guardar nada
    const empty = !S.settings.onboarded && !S.txns.length && !S.cards.some(c => has(c.saldo));
    SY = { token, pass, gistId:id, rev:null, salt:remote?.kdf?.salt, dirty:!empty };
  } else {
    const rev = uid(), blob = await K.seal(S, pass, { rev, updated:S.updated, device:DEVICE });
    SY = { token, pass, gistId:await gh.create(blob), rev, salt:blob.kdf.salt, dirty:false };
  }
  sySave(); await sync(); render({ keepScroll:true });
  if (!SY.err) toast(id ? "Conectado: este aparato ya usa los datos de la nube" : "Listo: datos cifrados en tu GitHub. Conecta el otro aparato con el mismo token y contraseña.");
}
function syncState() {
  if (!syncOn()) return null;
  if (SY.err) return { tone:"bad", t:"Sin sincronizar", d:SY.err };
  if (SY.dirty) return { tone:"warn", t:"Cambios por subir", d:"Se suben en unos segundos" };
  return { tone:"ok", t:"Sincronizado", d:SY.last ? whenTxt(SY.last) : "—" };
}
function renderSyncBtn(busy = false) {
  const b = $("#syncBtn"), st = syncState(); if (!b) return;
  b.hidden = !st;

}

async function writeFile() {
  try {
