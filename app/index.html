   PLAN (cálculo compartido entre vistas)
   ===================================================================== */
const ORDER_METHODS = ["avalanche", "snowball", "tsunami", "fireball", "cfi"];
const SPECIAL = {
  consolidacion:{ name:"Consolidación", icon:"🤝", short:"Un préstamo paga todo: un solo pago" },
  transferencia:{ name:"Transferencia de saldo", icon:"🔄", short:"Lo caro pasa a una tarjeta con promoción" }
};
/* Cómo funciona cada método y para quién conviene (se muestra en la tarjeta del método) */
const METHOD_DESC = {
  avalanche:() => "Pagan el mínimo en todo y el dinero extra va a la deuda con la <b>tasa más alta</b>. Al liquidarla, ese pago pasa a la siguiente más cara. <b>Ideal si</b> quieren pagar lo menos de intereses, aunque la primera victoria tarde más.",
  snowball:() => "El extra va a la deuda <b>más chica</b>, sin importar la tasa. Cada deuda cerrada suma su pago a la siguiente, como bola que crece (Dave Ramsey). <b>Ideal si</b> necesitan victorias rápidas para no aflojar.",
  tsunami:() => "Ustedes califican de 1 a 5 <b>cuánto les pesa</b> cada deuda (p. ej. un préstamo de familia) y el extra va a la que más angustia (Adam Baker). <b>Ideal si</b> la tranquilidad pesa más que el dinero.",
  fireball:() => `Separa las deudas «malas» (tasa de ${fp(umbral())} o más) de las «buenas». Ataca las malas de la <b>más chica a la más grande</b>; las buenas solo llevan mínimo hasta el final (SoFi). <b>Ideal si</b> quieren rapidez sin descuidar los intereses.`,
  cfi:() => "Divide cada saldo entre su pago mínimo: entre <b>más bajo el índice</b>, más dinero libera al mes al liquidarla (undebt.it). <b>Ideal si</b> lo que más aprieta es que el dinero no alcanza cada quincena.",
  consolidacion:() => "Piden <b>un préstamo</b> con tasa menor, liquidan todas las deudas y quedan con <b>un solo pago fijo</b>. <b>Solo conviene si</b> el CAT es más bajo que el de las tarjetas y dejan de usarlas.",
  transferencia:() => "Pasan el saldo de las tarjetas caras a una con <b>promoción</b> (0% o tasa baja por unos meses) y pagan fuerte antes de que acabe. <b>Ojo</b> con la comisión y con la tasa después de la promoción."
};
const methodMeta = m => K.METHODS[m] || SPECIAL[m] || { name:m, icon:"", short:"" };
const isSpecial = m => m === "consolidacion" || m === "transferencia";
const umbral = () => has(S.settings.fireballUmbral) ? num(S.settings.fireballUmbral) : 0.07;
/* Opciones del plan real (datos capturados): todas las deudas fuera de nómina entran salvo que se desmarque */
const planOpts = () => ({ source:"auto", includeOther:S.settings.planIncludeOther !== false, reserva:num(S.settings.planReserva), umbral:umbral() });
const scratchOpts = () => ({ source:"scratch", umbral:umbral() });

/* Corre un método cualquiera (de orden o especial) */
function runMethod(m, opts, budget) {
  if (m === "consolidacion") return K.consolidate(S, opts, S.settings.consol, budget);
  if (m === "transferencia") return K.transfer(S, opts, S.settings.transf, budget);
  return K.simulate(S, K.METHODS[m] ? m : "avalanche", budget, opts);
}

function planInfo() {
  const T = K.totals(S), opts = planOpts(), F = K.flujo(S, opts), minNow = K.minBudget(S, opts);
  if (minNow <= 0) return { T, F, has:false, opts, pays:{} };
  const auto = Math.max(0, Math.floor(F.paraDeudas / 10) * 10);
  const manual = has(S.settings.planBudget);
  const budget = manual ? num(S.settings.planBudget) : auto;
  const method = K.METHODS[S.settings.planMethod] || SPECIAL[S.settings.planMethod] ? S.settings.planMethod : "avalanche";
  const R = runMethod(method, opts, budget);
  // Para «Este mes» y el calendario se necesitan pagos por deuda real: en los especiales se usa avalancha como guía
  const payR = isSpecial(method) ? K.simulate(S, "avalanche", budget, opts) : R;
  return { T, F, has:!!R, opts, minNow, auto, manual, budget, suggested:auto, method, R, payR, pays:payR?.schedule[0]?.pays || {} };
}

function donut(items, size = 180) {
  const tot = items.reduce((a, i) => a + i.v, 0);
  if (tot <= 0) return empty("budget", "Sin datos todavía", "Llena el presupuesto para ver la gráfica.");
  const r = size / 2 - 14, cx = size / 2, L = 2 * Math.PI * r; let off = 0;
  const arcs = items.filter(i => i.v > 0).map(i => {
    const len = i.v / tot * L, gap = items.length > 1 ? Math.min(2, len / 3) : 0;
    const s = `<circle r="${r}" cx="${cx}" cy="${cx}" fill="none" stroke="${i.c}" stroke-width="20" stroke-dasharray="${Math.max(0, len - gap)} ${L - len + gap}" stroke-dashoffset="${-off}" transform="rotate(-90 ${cx} ${cx})"><title>${esc(i.l)}: ${fm(i.v)} (${fp(i.v / tot)})</title></circle>`;
    off += len; return s;
  }).join("");
  return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" role="img" aria-label="Distribución del gasto"><circle r="${r}" cx="${cx}" cy="${cx}" fill="none" stroke="var(--surface-3)" stroke-width="20"/>${arcs}
    <text x="50%" y="46%" text-anchor="middle" font-size="11" fill="var(--muted)">al mes</text>
    <text class="amt" x="50%" y="58%" text-anchor="middle" font-size="17" font-weight="700" fill="var(--ink)">${fm(tot)}</text></svg>`;
}
function ring(p, size = 96, stroke = 10, label = "", subl = "", tone = "var(--good)") {
  const r = (size - stroke) / 2, L = 2 * Math.PI * r, v = Math.max(0, Math.min(1, p || 0));
  return `<div class="ring" style="width:${size}px;height:${size}px"><svg width="${size}" height="${size}"><circle r="${r}" cx="${size / 2}" cy="${size / 2}" fill="none" stroke="var(--surface-3)" stroke-width="${stroke}"/>
    <circle r="${r}" cx="${size / 2}" cy="${size / 2}" fill="none" stroke="${tone}" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${v * L} ${L}" transform="rotate(-90 ${size / 2} ${size / 2})"/></svg><b>${label}</b>${subl ? `<small>${subl}</small>` : ""}</div>`;
}
function lineChart(series, { xlabel = i => i, height = 220, area = true, width = 1000 } = {}) {
  const W = isMobile() ? Math.min(width, 430) : width, H = isMobile() ? Math.min(height, 200) : height, PL = 56, PR = 16, PT = 12, PB = 26;
  const all = series.flatMap(s => s.data).filter(isFinite);
  const max = Math.max(1, ...all), n = Math.max(1, ...series.map(s => s.data.length - 1));
  const x = i => PL + i / n * (W - PL - PR), y = v => PT + (1 - v / max) * (H - PT - PB);
  const grid = [0, .25, .5, .75, 1].map(f => `<line x1="${PL}" x2="${W - PR}" y1="${y(max * f)}" y2="${y(max * f)}" stroke="var(--line-2)"/><text class="amt" x="${PL - 8}" y="${y(max * f) + 4}" text-anchor="end" font-size="10.5" fill="var(--muted)">${fm(max * f)}</text>`).join("");
  const paths = series.map(s => {
    const pts = s.data.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`);
    const fillA = area && s.area !== false ? `<path d="M${x(0)},${y(0)} L${pts.join(" L")} L${x(s.data.length - 1)},${y(0)} Z" fill="${s.c}" opacity=".08"/>` : "";
    return `${fillA}<polyline fill="none" stroke="${s.c}" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="${s.dash || ""}" points="${pts.join(" ")}"/>`;
  }).join("");
  const ticks = [...new Set([0, Math.round(n / 2), n])].map(i => `<text x="${x(i)}" y="${H - 6}" text-anchor="${i === 0 ? "start" : i === n ? "end" : "middle"}" font-size="10.5" fill="var(--muted)">${esc(xlabel(i))}</text>`).join("");
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block" role="img">${grid}${paths}${ticks}</svg>`;
}
function barsV(groups, { height = 200, keys = [], width = 440 } = {}) {
  const W = isMobile() ? Math.min(width, 430) : width, H = height, PL = 56, PB = 26, PT = 10;
  const max = Math.max(1, ...groups.flatMap(g => g.vals.map(v => v.v)));
  const gw = (W - PL - 10) / Math.max(1, groups.length), bw = Math.min(26, (gw - 14) / Math.max(1, groups[0]?.vals.length || 1));
  const y = v => PT + (1 - v / max) * (H - PT - PB);
  const grid = [0, .5, 1].map(f => `<line x1="${PL}" x2="${W - 10}" y1="${y(max * f)}" y2="${y(max * f)}" stroke="var(--line-2)"/><text class="amt" x="${PL - 8}" y="${y(max * f) + 4}" text-anchor="end" font-size="10.5" fill="var(--muted)">${fm(max * f)}</text>`).join("");
  const bars = groups.map((g, gi) => {
    const x0 = PL + gi * gw + (gw - bw * g.vals.length) / 2;
    return g.vals.map((v, vi) => `<rect x="${x0 + vi * bw + 1}" y="${y(v.v)}" width="${bw - 3}" height="${Math.max(0, H - PB - y(v.v))}" rx="4" fill="${v.c}"><title>${esc(g.l)} · ${esc(v.n)}: ${fm(v.v)}</title></rect>`).join("") +
      `<text x="${PL + gi * gw + gw / 2}" y="${H - 7}" text-anchor="middle" font-size="10.5" fill="var(--muted)">${esc(g.l)}</text>`;
  }).join("");
  const leg = keys.length ? `<div class="row tiny muted" style="margin-top:6px">${keys.map(k => `<span class="row" style="gap:5px"><i style="width:10px;height:10px;border-radius:3px;background:${k.c}"></i>${k.n}</span>`).join("")}</div>` : "";
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block" role="img">${grid}${bars}</svg>${leg}`;
}
function spark(data, w = 120, h = 34, c = "var(--primary)") {
  if (data.length < 2) return "";
  const max = Math.max(...data, 1), min = Math.min(...data, 0);
  const pts = data.map((v, i) => `${(i / (data.length - 1) * w).toFixed(1)},${(h - 2 - (v - min) / (max - min || 1) * (h - 4)).toFixed(1)}`).join(" ");
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><polyline fill="none" stroke="${c}" stroke-width="2" points="${pts}"/></svg>`;
}

/* ---------- Este mes ---------- */
function vMes() {
  const mk = sub.mes, P = planInfo(), isCur = mk === monthKey();
  const items = K.monthItems(S, mk, isCur ? P.pays : {});
  const total = K.sum(items, i => num(i.amt)), paidAmt = K.sum(items.filter(i => i.paid), i => num(i.amt));
  const done = items.filter(i => i.paid).length;
  const today = new Date(); const td = isCur ? today.getDate() : (mk < monthKey() ? 99 : 0);
  const Q = K.quincenas(S, isCur ? P.pays : {});
  const chk = i => { const late = !i.paid && i.day && i.day < td;
    return `<div class="check ${i.paid ? "on" : ""}" role="checkbox" aria-checked="${i.paid}" tabindex="0" data-check="${i.key}" data-kind="${i.kind}" data-id="${i.id}" data-amt="${num(i.amt)}">
      <span class="box">${icon("check")}</span><span class="day">${i.day ? "día " + i.day : "—"}</span>
      <span class="nm"><span class="b">${i.kind === "card" ? "💳 " : ""}${esc(i.name)}</span>${late ? ` ${pill("vencido", "bad")}` : isCur && !i.paid ? dueTag(i.day) : ""}${i.kind === "card" && isCur && P.has && P.pays[i.id] ? `<div class="tiny muted">${P.payR?.order[0]?.id === i.id ? "🎯 Objetivo del plan" : "Pago mínimo del plan"}</div>` : ""}</span>
      <span class="amt num">${fm(i.amt)}</span></div>`; };
  const col = (title, list, q) => panel(title, `<div class="kv" style="margin-bottom:12px"><span>Entra</span><span class="good">${fm(q.in)}</span><span>Sale</span><span>${fm(q.out)}</span><hr><span class="b">Queda</span><span class="${q.in - q.out < 0 ? "bad" : "good"}">${fm(q.in - q.out)}</span></div>
      ${list.length ? `<div class="checks">${list.map(chk).join("")}</div>` : empty("checksq", "Sin pagos con fecha", "Agrega el día de pago a tus gastos.")}`);
  return ph("Este mes", "Palomea cada pago al hacerlo. Al palomear una tarjeta se registra el pago y baja su saldo.", monthNav("mes", mk), "Checklist") +
  `<div class="grid g4">
    <section class="panel kpi" style="display:flex;align-items:center;gap:16px">${ring(items.length ? done / items.length : 0, 84, 9, `${done}/${items.length}`, "")}<div><div class="lbl muted b small">Pagos hechos</div><div class="tiny muted">${items.length - done} pendientes</div></div></section>
    ${kpi({ label:"Total con fecha", value:M(total), ic:"cal", tone:"primary", foot:"Pagos fijos del mes" })}
    ${kpi({ label:"Ya pagado", value:M(paidAmt), ic:"check", tone:"good", foot:bar(total ? paidAmt / total : 0, "good") })}
    ${kpi({ label:"Falta", value:M(total - paidAmt), ic:"alert", tone:"warn", foot:items.filter(i => !i.paid && i.day && i.day < td).length ? pill(items.filter(i => !i.paid && i.day && i.day < td).length + " vencidos", "bad") : "Nada vencido" })}
  </div>
  <div class="grid g2 mt">${col("Quincena 1 · del 1 al 15", items.filter(i => i.day && i.day <= 15), Q[0])}${col("Quincena 2 · del 16 al fin de mes", items.filter(i => i.day && i.day > 15), Q[1])}</div>
  ${items.some(i => !i.day) ? `<div class="mt">${panel("Sin día definido", `<div class="checks">${items.filter(i => !i.day).map(chk).join("")}</div>`)}</div>` : ""}
  <p class="tiny muted mt">«Entra» y «Sale» incluyen todo el presupuesto: lo que no tiene día fijo (mandado, gasolina) se reparte entre las dos quincenas.</p>`;
}

/* ---------- Plan de pago ----------
   Paso 1: con qué datos (automático = todo lo capturado; desde cero = escenario libre).
   Paso 2: los 7 métodos comparados con el mismo pago mensual.
   Paso 3: el plan elegido: pros/contras con sus números, qué pagar este mes, calendario, plazo y copos de nieve. */
const durTxt = m => m === Infinity || m == null ? "∞" : m >= 12 ? `${Math.floor(m / 12)} año${m >= 24 ? "s" : ""}${m % 12 ? ` ${m % 12} m` : ""}` : `${m} mes${m > 1 ? "es" : ""}`;
const firstPaid = r => r && r.cards ? [...r.cards].filter(c => c.paidMonth).sort((a, b) => a.paidMonth - b.paidMonth)[0] : null;
const ulist = a => `<ul class="small" style="margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px">${a.filter(Boolean).map(t => `<li>${t}</li>`).join("")}</ul>`;
let planCtx = null;

function prosCons(m, R, all, ctx) {
  const av = all.avalanche;
  const diff = R && av && isFinite(R.totalInt) && isFinite(av.totalInt) ? R.totalInt - av.totalInt : null;
  const vsAv = diff === null ? "" : diff > 0.5 ? `Cuesta <b class="amt">${fm(diff)}</b> más de intereses que la avalancha.`
    : diff < -0.5 ? `Ahorra <b class="amt">${fm(-diff)}</b> de intereses comparado con la avalancha.` : "Paga prácticamente los mismos intereses que la avalancha.";
  const f = firstPaid(R), top = R?.order?.[0];
  const firstTxt = f ? `Primera deuda cerrada en el mes ${f.paidMonth} (<b>${esc(f.nombre)}</b>).` : "";
  const maxT = Math.max(0, ...((av && av.cards) || []).map(x => x.tasa));
  switch (m) {
    case "avalanche": return {
      pros:["Es el método de orden que menos intereses paga: todo lo extra va a lo más caro.", top ? `Ataca primero <b>${esc(top.nombre)}</b>, con tasa de ${fp(top.tasa, 1)}.` : ""],
      cons:[f ? `La primera deuda se cierra hasta el mes ${f.paidMonth} (${esc(f.nombre)}): al principio puede sentirse lento.` : "", "Pide constancia: el avance se nota en el saldo total más que en cuentas cerradas."] };
    case "snowball": return {
      pros:[firstTxt + " El avance se ve rápido y eso ayuda a no soltar el plan.", "Cada deuda cerrada libera su pago para la siguiente: cada vez hay menos cuentas que vigilar."],
      cons:[vsAv, "Mientras se cierran las chicas, la de tasa más alta sigue cobrando intereses."] };
    case "tsunami": return {
      pros:[top ? `Quita primero lo que más pesa: <b>${esc(top.nombre)}</b> (peso ${top.emo} de 5).` : "", "Sirve cuando la angustia, o la relación con quien prestó, frena todo lo demás."],
      cons:[vsAv, "Depende de calificar bien el «peso» (1 a 5) de cada deuda en el paso 1."] };
    case "fireball": {
      const good = (R?.cards || []).filter(c => c.tasa < ctx.umbral);
      return { pros:[`Separa las deudas «malas» (tasa ≥ ${fp(ctx.umbral)}) de las «buenas» y se enfoca en las caras.`, firstTxt ? firstTxt + " Victorias rápidas dentro de las deudas malas." : ""],
        cons:[vsAv, good.length ? `Las «buenas» (${good.map(c => esc(c.nombre)).join(", ")}) esperan al final aunque sean chicas.` : "Aquí todas las deudas son «malas»: se comporta como bola de nieve."] };
    }
    case "cfi": return {
      pros:[f ? `Libera flujo rápido: al cerrar <b>${esc(f.nombre)}</b> quedan libres ${fm(f.min0)} al mes.` : "", "Pensado para cuando el dinero del mes es lo que más aprieta."],
      cons:[vsAv, "Ignora la tasa de interés: puede dejar para después lo más caro."] };
    case "consolidacion": {
      const c = S.settings.consol;
      return { pros:[R ? `Un solo pago fijo de <b class="amt">${fm(R.pmt)}</b> por ${R.plazo} meses; si pagan más, terminan antes.` : "",
          `Tasa fija de ${fp(c.tasa, 1)} contra hasta ${fp(maxT, 1)} de sus tarjetas.`, diff !== null && diff < -0.5 ? vsAv : ""],
        cons:[diff !== null && diff > 0.5 ? vsAv : "", R ? `Comisión por apertura de <b class="amt">${fm(R.fee)}</b>.` : "",
          "Si siguen usando las tarjetas terminan con doble deuda: Condusef recomienda guardar los plásticos.", "Necesita aprobación del banco; revisen el CAT y si el seguro va incluido."] };
    }
    case "transferencia": {
      const t = S.settings.transf;
      return { pros:[R ? `Mueve <b class="amt">${fm(R.moved)}</b> de lo más caro a ${fp(t.promo, 1)} por ${t.meses} meses.` : "", diff !== null && diff < -0.5 ? vsAv : ""],
        cons:[diff !== null && diff > 0.5 ? vsAv : "", R ? `Comisión por transferencia de <b class="amt">${fm(R.fee)}</b>.` : "",
          `Lo que no se pague en ${t.meses} meses sube a ${fp(t.despues, 1)}.`, "Un pago atrasado puede cancelar la promoción, y solo se transfiere hasta el límite de la tarjeta."] };
    }
  }
  return { pros:[], cons:[] };
}

      <p class="tiny muted" style="margin-bottom:0">${F.gFijo + F.gVar === 0 ? "⚠ El presupuesto está vacío: llénalo para que el cálculo sea real. " : ""}Sale de Ingresos y Presupuesto. <button class="btn sm ghost" data-go="presupuesto">Editar presupuesto</button></p>
    </div>

        ${others.length ? `<label class="row small" style="gap:6px;cursor:pointer"><input type="checkbox" ${P.opts.includeOther ? "checked" : ""} data-setting="planIncludeOther" style="width:16px;height:16px;accent-color:var(--primary)"> Incluir otras deudas</label>` : ""}</div>
      <div class="tbl" style="border:1px solid var(--line)"><table><thead><tr><th>Deuda</th><th class="r">Saldo</th><th class="r">Tasa</th><th class="r">Mínimo</th><th class="c" title="Para tsunami: 5 = la que más angustia">Peso</th></tr></thead><tbody>

          <td class="r">${fm(c.bal)}</td><td class="r">${c.tasa ? fp(c.tasa, 1) : "0%"}</td><td class="r">${fm(minRow(c))}</td>
          <td class="c"><select class="inl day" style="width:58px" data-emo="${c.kind === "card" ? "cards" : "debts"}:${c.id}" aria-label="Peso emocional de ${esc(c.nombre)}">${[1, 2, 3, 4, 5].map(n => `<option ${n === c.emo ? "selected" : ""}>${n}</option>`).join("")}</select></td></tr>`).join("")
          || `<tr><td colspan="5">${empty("card", "Sin deudas con saldo", "Captura los saldos en Tarjetas u Otras deudas.")}</td></tr>`}

      || `<tr><td colspan="7">${empty("plus", "Escenario vacío", "Agrega deudas o copia las tuyas como punto de partida.")}</td></tr>`}
  </tbody></table></div>
  <div class="row mt"><button class="btn" data-act="scradd">${icon("plus")} Agregar deuda</button><button class="btn ghost" data-act="scrcopy">${icon("download")} Copiar mis deudas actuales</button>${sc.debts.length ? `<button class="btn ghost danger" data-act="scrclear">Vaciar</button>` : ""}
    <span class="row" style="margin-left:auto;gap:8px"><label class="small b" for="scb">Pago mensual a deudas</label><span class="affix"><span class="pre">$</span><input id="scb" class="inp" style="width:140px;padding-left:24px" type="number" min="0" step="50" value="${esc(sc.budget)}" placeholder="${Math.ceil(minNow / 10) * 10}" data-scrbudget="1"></span></span></div>
  <p class="tiny muted" style="margin-bottom:0">Mínimos del escenario: <span class="amt">${fm(minNow)}</span> al mes${has(sc.budget) ? "" : ` · sin pago capturado se usa el mínimo (${fm(budget)})`}. Si dejas vacío el mínimo de una tarjeta, se estima con la regla de Banxico.</p>`;
}

function methodGrid(all, current) {
  const keys = [...ORDER_METHODS, "consolidacion", "transferencia"];
  const ok = k => all[k] && isFinite(all[k].months) && !all[k].short;
  const valid = keys.filter(ok);
  const best = valid.length ? valid.reduce((a, b) => all[a].totalInt <= all[b].totalInt ? a : b) : null;
  const fastest = valid.filter(k => ORDER_METHODS.includes(k)).reduce((a, b) => a === null || (firstPaid(all[b])?.paidMonth ?? 1e9) < (firstPaid(all[a])?.paidMonth ?? 1e9) ? b : a, null);
  return `<div class="mgrid">${keys.map(k => {
    const r = all[k], meta = methodMeta(k), on = k === current, f = firstPaid(r);
    const body = !r ? `<div class="tiny muted">${k === "transferencia" ? "No hay deuda de tarjeta más cara que la promoción" : "Sin datos"}</div>`
      : r.short ? `<div class="bad small b">No alcanza ni para el pago mínimo${k === "consolidacion" ? ` (pago fijo ${fm(r.pmt)})` : ""}</div>`
      : !isFinite(r.months) ? `<div class="bad small b">No se termina de pagar</div>`
      : `<div class="mv">${durTxt(r.months)}</div><div class="tiny">Libres en <b style="text-transform:capitalize">${finish(r.months)}</b></div><div class="tiny">Intereses <b class="amt">${fm(r.totalInt)}</b></div>${f ? `<div class="tiny muted">1ª cerrada: mes ${f.paidMonth} · ${esc(f.nombre)}</div>` : ""}`;
    return `<button class="mcard ${on ? "on" : ""}" data-pick="${k}" aria-pressed="${on}"><div class="between"><span class="mi">${meta.icon}</span><span class="row" style="gap:4px;justify-content:flex-end">${k === best ? pill("💰 Menos intereses", "good") : ""}${k === fastest ? pill("⚡ Victoria rápida", "violet") : ""}</span></div>
      <div class="b" style="margin-top:6px">${meta.name}</div><div class="tiny muted" style="margin-bottom:6px">${meta.short}</div><p class="mdesc">${METHOD_DESC[k]?.() || ""}</p>${body}${on ? `<div style="margin-top:8px">${pill("✔ Elegido", "info")}</div>` : ""}</button>`;
  }).join("")}</div>
  <p class="tiny muted" style="margin:10px 0 0">${all.minimos && isFinite(all.minimos.months) ? `Referencia: pagando solo los mínimos tardarían ${durTxt(all.minimos.months)} y pagarían ${fm(all.minimos.totalInt)} de intereses.` : "Referencia: pagando solo los mínimos, alguna deuda nunca se termina."} Todos los métodos pagan los mínimos de todo; cambian en a qué deuda mandan el dinero extra.</p>`;
}

const cfgFld = (grp, k, l, t, v) => `<div class="fld"><label>${l}</label>${
  t === "pct" ? `<div class="affix"><input type="number" min="0" step="0.5" value="${+(num(v) * 100).toFixed(2)}" data-cfg="${grp}:${k}:pct"><span class="suf">%</span></div>`
  : t === "money" ? `<div class="affix"><span class="pre">$</span><input type="number" min="0" step="500" value="${num(v)}" data-cfg="${grp}:${k}"></div>`
  : `<input type="number" min="1" step="1" value="${num(v)}" data-cfg="${grp}:${k}">`}</div>`;
function specialParams(m) {
  if (m === "consolidacion") { const c = S.settings.consol;
    return `<div class="section" style="margin:4px 0 10px">Condiciones del préstamo</div><div class="form">${cfgFld("consol", "tasa", "Tasa anual del préstamo", "pct", c.tasa)}${cfgFld("consol", "plazo", "Plazo (meses)", "int", c.plazo)}${cfgFld("consol", "comision", "Comisión por apertura", "pct", c.comision)}</div>
      <p class="tiny muted">Pongan la tasa que les ofrezca el banco. Condusef: comparar el CAT antes de firmar y no usar las tarjetas mientras dure el préstamo.</p>`; }
  if (m === "transferencia") { const t = S.settings.transf;
    return `<div class="section" style="margin:4px 0 10px">Condiciones de la transferencia</div><div class="form">${cfgFld("transf", "promo", "Tasa de promoción", "pct", t.promo)}${cfgFld("transf", "meses", "Meses de promoción", "int", t.meses)}${cfgFld("transf", "despues", "Tasa después de la promoción", "pct", t.despues)}${cfgFld("transf", "comision", "Comisión por transferencia", "pct", t.comision)}${cfgFld("transf", "limite", "Límite de la tarjeta destino", "money", t.limite)}</div>
      <p class="tiny muted">Se mueve primero la deuda más cara, hasta el límite de la tarjeta destino. Lo que no cabe sigue en su tarjeta con avalancha.</p>`; }
  if (m === "fireball") return `<div class="form" style="margin-bottom:6px">${cfgFldSetting("fireballUmbral", "Tasa a partir de la cual una deuda es «mala»", umbral())}</div>`;

}
const cfgFldSetting = (k, l, v) => `<div class="fld"><label>${l}</label><div class="affix"><input type="number" min="0" step="1" value="${+(num(v) * 100).toFixed(2)}" data-setting="${k}"><span class="suf">%</span></div><small>SoFi usa 7% como corte; en México casi todas las tarjetas pasan de 30%.</small></div>`;

function planDetail(m, R, all, budget, minNow, ctx) {

  if (!R) return panel(`${meta.icon} ${meta.name}`, specialParams(m) + empty("plan", "Este método no aplica con los datos actuales"));
  const pc = prosCons(m, R, all, ctx), mo = all.minimos, first = R.schedule[0] || { pays:{} };
  const sched = R.schedule.slice(0, 12), order = R.order;
  const series = [mo ? { c:"var(--bad)", dash:"5 5", area:false, data:mo.series.slice(0, Math.min(mo.series.length, Math.max(R.series.length * 2, 24))) } : null, { c:"var(--primary)", data:R.series }].filter(Boolean);
  return `<div class="grid g21">
    ${panel(`${meta.icon} ${meta.name}`, `${R.short ? `<div class="callout bad" style="margin-bottom:12px">⚠️ <b>El pago mensual (${fm(budget)}) no cubre ${m === "consolidacion" ? `el pago fijo del préstamo (${fm(R.pmt)})` : `los mínimos (${fm(minNow)})`}.</b></div>` : ""}
      <div class="grid g3" style="margin-bottom:14px">
        <div><div class="tiny muted b">Libres en</div><div class="b" style="font-size:18px;text-transform:capitalize">${finish(R.months) || "Nunca"}</div><div class="tiny muted">${durTxt(R.months)}</div></div>
        <div><div class="tiny muted b">Intereses totales</div><div class="b" style="font-size:18px"><span class="amt">${fm(R.totalInt)}</span></div>${mo && isFinite(mo.totalInt) && isFinite(R.totalInt) ? `<div class="tiny good">${fm(mo.totalInt - R.totalInt)} menos que solo mínimos</div>` : ""}</div>
        <div><div class="tiny muted b">Pago al mes</div><div class="b" style="font-size:18px"><span class="amt">${fm(budget)}</span></div>${m === "consolidacion" ? `<div class="tiny muted">pago fijo del préstamo ${fm(R.pmt)}</div>` : ""}</div></div>
      ${specialParams(m)}
      <div class="grid g2"><div><div class="section" style="margin:6px 0 8px">✅ A favor</div>${ulist(pc.pros)}</div><div><div class="section" style="margin:6px 0 8px">⚠️ En contra</div>${ulist(pc.cons)}</div></div>`, { sub:meta.short })}
    ${panel("Este mes paguen", `<table><tbody>${order.map((c, i) => `<tr><td style="padding-left:0"><div class="cell-title">${i === 0 && !isSpecial(m) ? "🎯 " : ""}${esc(c.nombre)}</div><div class="cell-sub">${isSpecial(m) ? "" : (i === 0 ? "Objetivo: todo lo extra va aquí" : "Solo el mínimo") + " · "}${c.tasa ? "tasa " + fp(c.tasa, 1) : "sin intereses"}</div></td><td class="r" style="padding-right:0"><b class="amt">${fm(first.pays[c.id] || 0)}</b></td></tr>`).join("")}</tbody>
      <tfoot><tr><td style="padding-left:0">Total</td><td class="r amt" style="padding-right:0">${fm(Object.values(first.pays).reduce((a, b) => a + b, 0))}</td></tr></tfoot></table>
      <div class="section" style="margin-top:18px">Se liquida</div>${[...R.cards].sort((a, b) => (a.paidMonth ?? 1e9) - (b.paidMonth ?? 1e9)).map(c => `<div class="between small" style="padding:4px 0"><span>${esc(c.nombre)}</span><b style="text-transform:capitalize">${c.paidMonth ? finish(c.paidMonth) : '<span class="bad">no termina</span>'}</b></div>`).join("")}`, { sub:monthName(start) })}
  </div>
  <div class="mt">${panel("Deuda total mes a mes", lineChart(series, { width:1040, height:240, xlabel:i => i === 0 ? "hoy" : "mes " + i }), { sub:`<span style="color:var(--primary)">━</span> este plan &nbsp; <span style="color:var(--bad)">┅</span> solo mínimos` })}</div>
  <div class="mt">${panel("Calendario de pagos · primeros 12 meses", `<div class="tbl"><table class="keep"><thead><tr><th>Mes</th>${order.map(c => `<th class="r">${esc(c.nombre)}</th>`).join("")}<th class="r">Total</th><th class="r">Intereses</th><th class="r">Deuda restante</th></tr></thead>
    <tbody>${sched.map(s => `<tr><td style="text-transform:capitalize">${monthName(addMonths(start, s.month - 1))}</td>${order.map(c => `<td class="r">${s.pays[c.id] ? fm(s.pays[c.id]) : '<span class="faint">—</span>'}</td>`).join("")}<td class="r b">${fm(Object.values(s.pays).reduce((a, b) => a + b, 0))}</td><td class="r muted">${fm(s.interest)}</td><td class="r">${fm(s.total)}</td></tr>`).join("")}</tbody></table></div>`, { cls:"flush", sub:"lo que toca pagar a cada deuda" })}</div>`;
}

function plazoTool(opts, capacity, target) {
  const rows = ORDER_METHODS.map(m => { const b = K.budgetForMonths(S, m, target, opts); return { m, b, r:b ? K.simulate(S, m, b, opts) : null }; }).filter(x => x.b && x.r);
  if (!rows.length) return "";
  const minB = Math.min(...rows.map(x => x.b));
  return panel("¿En cuánto tiempo quieren liquidar?", `<div class="row" style="gap:12px;align-items:flex-end;margin-bottom:12px">
      <div class="fld" style="width:140px"><label for="pm">Meses</label><input id="pm" type="number" min="1" max="120" step="1" value="${target}" data-plazo="1"></div>
      <div class="row">${[6, 12, 18, 24, 36].map(m => `<button class="btn sm ${m === target ? "primary" : ""}" data-months="${m}">${m} meses</button>`).join("")}</div>
      <span class="small muted" style="margin-left:auto">Meta: libres en <b style="text-transform:capitalize">${finish(target)}</b> · pueden pagar <b class="amt">${fm(capacity)}</b>/mes</span></div>
    <div class="tbl" style="border:1px solid var(--line)"><table><thead><tr><th>Método</th><th class="r">Pago mensual necesario</th><th>¿Alcanza?</th><th class="r">Intereses</th><th>1ª deuda cerrada</th><th></th></tr></thead><tbody>
    ${rows.map(x => { const f = firstPaid(x.r), fits = x.b <= capacity;
      return `<tr><td>${methodMeta(x.m).icon} <b>${methodMeta(x.m).name}</b></td><td class="r b">${fm(x.b)}${x.b === minB ? ` ${pill("el más bajo", "good")}` : ""}</td>
        <td>${fits ? `<span class="good b">✔ Sí</span> <span class="tiny muted">sobran ${fm(capacity - x.b)}</span>` : `<span class="bad b">✖ Faltan ${fm(x.b - capacity)}</span>`}</td>
        <td class="r">${fm(x.r.totalInt)}</td><td class="small">${f ? `mes ${f.paidMonth} · ${esc(f.nombre)}` : "—"}</td><td class="r"><button class="btn sm" data-useplan="${x.m}:${x.b}">Usar</button></td></tr>`; }).join("")}
    </tbody></table></div>
    <p class="tiny muted" style="margin-bottom:0">Calcula el pago mensual exacto (redondeado a $10) para terminar en ese plazo con cada método. «Usar» lo deja como plan activo.</p>`, { sub:"pago mensual que necesita cada método" });
}

function vPlan() {
  const src = S.settings.planSource === "scratch" ? "scratch" : "auto";
  const head = ph("Plan de pago", "Siete métodos comparados con los mismos números. Primero elige con qué datos trabajar.", `<button class="btn" data-act="print">${icon("print")} Imprimir</button>`, "Estrategia");
  const seg = `<div class="seg" style="margin-bottom:16px;flex-wrap:wrap"><button class="${src === "auto" ? "on" : ""}" data-src="auto">🔄 Automático: con todo lo capturado</button><button class="${src === "scratch" ? "on" : ""}" data-src="scratch">✏️ Desde cero: escenario libre</button></div>`;
  let opts, budget, method, minNow, capacity, body1, target;
  if (src === "auto") {
    const P = planInfo();
    opts = P.opts; budget = P.budget; method = P.method; minNow = P.minNow || 0; capacity = P.F.paraDeudas;
    target = Math.max(1, Math.round(num(S.settings.planMonths) || 12));
    body1 = P.has ? autoSource(P) : autoSource({ ...P, budget:0, auto:0, minNow:0 });
  } else {
    opts = scratchOpts(); minNow = K.minBudget(S, opts);
    budget = has(S.scratch.budget) ? num(S.scratch.budget) : Math.ceil(minNow / 10) * 10;
    method = K.METHODS[S.scratch.method] || SPECIAL[S.scratch.method] ? S.scratch.method : "avalanche";
    capacity = budget; target = Math.max(1, Math.round(num(S.scratch.months) || 12));
    body1 = scratchSource(budget, minNow);
  }
  const step1 = panel("1 · ¿Con qué datos?", seg + body1);
  if (!K.pool(S, opts).length) { planCtx = null; return head + step1 + `<div class="mt">${panel("", empty("plan", "No hay deudas con saldo para simular", src === "auto" ? "Captura saldos en Tarjetas u Otras deudas, o usa «Desde cero»." : "Agrega deudas al escenario."))}</div>`; }
  const all = {};
  for (const k of [...ORDER_METHODS, "consolidacion", "transferencia"]) all[k] = runMethod(k, opts, budget);
  all.minimos = K.simulate(S, "minimos", 0, opts);
  planCtx = { opts, budget, method };
  return head + step1 +
    `<div class="section">2 · Compara los métodos <span class="tiny muted" style="text-transform:none;letter-spacing:0;font-weight:500">con ${fm(budget)} al mes · toca uno para elegirlo</span></div>` +
    panel("", methodGrid(all, method)) +
    `<div class="section">3 · El plan elegido${src === "scratch" ? " (escenario libre)" : ""}</div>` +
    planDetail(method, all[method], all, budget, minNow, { umbral:umbral() }) +
    `<div class="mt">${plazoTool(opts, capacity, target)}</div>
    <div class="grid g2 mt">
      ${panel("❄️ Copos de nieve: pagos extra", `<label class="small b" for="whatif">Pago extra al mes: <span id="wiv" class="amt">${fm(0)}</span></label>
        <input id="whatif" type="range" min="0" max="10000" step="250" value="0" style="margin:10px 0"><div id="wio" class="kv"></div>
        <p class="tiny muted" style="margin-bottom:0">El método «copo de nieve» suma pagos extra chicos (lo que ahorran en gastos hormiga, una venta extra) al plan elegido.</p>`, { sub:"simulador" })}
      ${panel("📌 Reglas que aplican a cualquier método", ulist(["No usar las tarjetas mientras dure el plan (Condusef: guardar los plásticos).", "Pagar siempre al menos el mínimo de todas, a tiempo: un atraso cuesta más que cualquier método.", "Cuando una deuda se cierra, su pago completo pasa a la siguiente (efecto cascada).", "Revisar el plan cada mes con el estado de cuenta nuevo."]))}
    </div>
    <p class="tiny muted mt">Estimación: tasa ÷ 12 × (1 + IVA ${fp(K.getIva())}) y mínimos de Banxico (Circular 13/2011). El banco calcula sobre saldo promedio diario; el real puede variar un poco.</p>`;
}
function planAfter() {
  const wi = $("#whatif"), wo = $("#wio"), wv = $("#wiv");
  if (!planCtx || !wi) return;
  const { opts, budget, method } = planCtx, base = runMethod(method, opts, budget);
  const upd = () => {
    const x = +wi.value, r = runMethod(method, opts, budget + x), ok = base && r && isFinite(base.months) && isFinite(r.months) && !base.short;
    wv.textContent = fm(x);
    wo.innerHTML = `<span>Pago total al mes</span><span>${fm(budget + x)}</span><span>Libres en</span><span style="text-transform:capitalize">${r && isFinite(r.months) ? finish(r.months) : "Nunca"}</span>
      <span>Meses que se ahorran</span><span class="good">${ok ? base.months - r.months : "—"}</span><span>Intereses que se ahorran</span><span class="good">${ok ? fm(base.totalInt - r.totalInt) : "—"}</span>`;
  };
  wi.addEventListener("input", upd); upd();
}

/* ---------- Calendario ---------- */
function vCalendario() {
  const mk = sub.cal, [y, m] = mk.split("-").map(Number);
  const last = new Date(y, m, 0).getDate(), startDow = (new Date(y, m - 1, 1).getDay() + 6) % 7;
  const ev = {}, push = (d, cls, txt) => { const k = Math.min(+d, last); (ev[k] = ev[k] || []).push(`<div class="ev ${cls}" title="${esc(txt)}">${esc(txt)}</div>`); };
  const mes = MESES[m - 1];
  for (const i of S.incomes) if (has(i.dia) && has(i.monto) && (fq(i.frecuencia) >= 1 || i.mes === mes)) {
    push(i.dia, "in", `+${fm(i.monto)} ${i.fuente}`);
    if (i.frecuencia === "Quincenal") push(+i.dia <= 15 ? +i.dia + 15 : +i.dia - 15, "in", `+${fm(i.monto)} ${i.fuente}`);
  }
  for (const c of S.cards) if (has(c.diaCorte)) push(c.diaCorte, "cut", `✂ Corte ${c.nombre}`);
  for (const c of S.cobros) if (!c.liquidado && c.compromiso && c.compromiso.slice(0, 7) === mk && cSaldo(c) > 0) push(+c.compromiso.slice(8), "in", `💰 Cobrar ${fm(cSaldo(c))} ${cName(c)}`);
  const isCur = mk === monthKey(), items = K.monthItems(S, mk, isCur ? planInfo().pays : {});
  for (const it of items) if (it.day) push(it.day, `${it.kind === "card" ? "evcard" : "out"} ${it.paid ? "done" : ""}`, `${it.kind === "card" ? "💳 " : ""}${has(it.amt) ? fm(it.amt) + " " : ""}${it.name}`);
  const t = new Date(); let cells = "";
  for (let i = 0; i < startDow; i++) cells += `<div class="day out"></div>`;
  for (let d = 1; d <= last; d++) cells += `<div class="day ${isCur && t.getDate() === d ? "today" : ""}"><span class="n">${d}</span>${(ev[d] || []).join("")}</div>`;
  const dows = ["dom", "lun", "mar", "mié", "jue", "vie", "sáb"];
  const agenda = Object.keys(ev).map(Number).sort((a, b) => a - b).map(d => `<div class="ag-day ${isCur && t.getDate() === d ? "today" : ""}"><div class="ag-n"><b>${d}</b><span>${dows[new Date(y, m - 1, d).getDay()]}</span></div><div class="ag-ev">${ev[d].join("")}</div></div>`).join("");
  return ph("Calendario de pagos", "Ingresos, cortes y pagos con fecha. Los pagos palomeados en «Este mes» salen tachados.", `${monthNav("cal", mk)}<button class="btn primary" data-act="ics">${icon("bell")} Recordatorios al celular</button><button class="btn" data-act="print">${icon("print")} Imprimir</button>`, "Agenda") +
    `<div class="row tiny" style="margin-bottom:12px">${pill("Ingreso", "good")}${pill("Pago de tarjeta", "bad")}${pill("Gasto o deuda", "warn")}${pill("Corte de tarjeta")}</div>
    <div class="cal">${["Lun", "Mar", "Mié", "Jue", "Vie", "Sáb", "Dom"].map(d => `<div class="dow">${d}</div>`).join("")}${cells}</div>
    <div class="agenda">${agenda || empty("cal", "Sin pagos con fecha este mes", "Agrega el día de pago a tus gastos y tarjetas.")}</div>`;
}

/* ---------- Tarjetas ---------- */

function vTarjetas() {
  const T = K.totals(S);
  const rows = S.cards.map(c => { const po = C.payoff(c);
    return `<tr class="click" data-card="${c.id}"><td><div class="cell-title">${esc(c.nombre)}</div><div class="cell-sub">${esc(c.titular || "")}${c.fechaEdo ? " · edo. " + fmtDate(c.fechaEdo) : ""}</div></td>
      <td class="r">${fm(c.saldo)}</td><td class="r">${fm(C.rev(c))}</td><td class="r">${fp(c.tasa, 1)}</td><td class="r">${fm(C.interest(c))}</td>

function cardDrawer(id) {
  const c = S.cards.find(x => x.id === id); if (!c) return;
  const i = S.cards.indexOf(c), u = C.util(c), po = C.payoff(c), due = K.nextDue(c.diaPago);
  const hist = [...(c.history || [])].sort((a, b) => b.fecha.localeCompare(a.fecha));
  const saldos = (c.history || []).filter(h => has(h.saldo)).sort((a, b) => a.fecha.localeCompare(b.fecha)).map(h => num(h.saldo));
  $("#drawer").innerHTML = `<header><div><div class="tiny muted b" style="text-transform:uppercase;letter-spacing:.06em">Tarjeta</div><h2 style="font-size:18px">${esc(c.nombre)}</h2></div><button class="iconbtn" data-act="closedrawer" aria-label="Cerrar">${icon("x")}</button></header>
  <div class="db">${ccTile(c, i).replace('data-card', 'data-noop')}
    <div class="row mt"><button class="btn primary" data-pay="${c.id}">${icon("cash")} Registrar pago</button><button class="btn" data-stmt="${c.id}">${icon("receipt")} Nuevo estado de cuenta</button><button class="btn ghost" data-edit="cards:${c.id}">${icon("edit")} Editar</button></div>
    <div class="section">Números</div>
    <div class="kv"><span>Saldo al corte</span><span>${fm(c.saldo)}</span><span>Cobra intereses (sin MSI)</span><span>${fm(C.rev(c))}</span><span>Uso del límite</span><span>${fp(u)}</span><hr>
      <span>Tasa anual · CAT</span><span>${fp(c.tasa, 1)} · ${fp(c.cat, 1)}</span><span>Interés + IVA este mes</span><span class="bad">${fm(C.interest(c))}</span><span>Pago mínimo${has(c.pagoMin) ? "" : " (est.)"}</span><span>${has(c.saldo) ? fm(C.minPay(c)) : "—"}</span><span>Para no generar intereses</span><span>${fm(c.pagoNoInt)}</span><hr>
      <span>Lo que pagan al mes</span><span>${fm(c.pagoReal)}</span><span>Meses para liquidar a ese ritmo</span><span>${po ? (po.months === Infinity ? "Nunca" : po.months) : "—"}</span><span>Intereses que pagarían</span><span>${po ? (po.interest === Infinity ? "∞" : fm(po.interest)) : "—"}</span><hr>
      <span>Corte · pago</span><span>día ${c.diaCorte || "—"} · día ${c.diaPago || "—"}</span><span>Próximo pago</span><span>${due ? due.date.toLocaleDateString("es-MX", { weekday:"short", day:"numeric", month:"short" }) + (due.days === 0 ? " (hoy)" : ` (en ${due.days} d)`) : "—"}</span></div>
    ${c.notas ? `<div class="callout mt small">${esc(c.notas)}</div>` : ""}
    <div class="section">Historial ${saldos.length > 1 ? spark(saldos) : ""}</div>
    ${hist.length ? `<div class="tbl"><table><thead><tr><th>Fecha</th><th>Movimiento</th><th class="r">Monto</th><th class="r">Saldo</th><th></th></tr></thead><tbody>${hist.map(h => `<tr><td>${fmtDate(h.fecha)}</td><td>${h.tipo === "pago" ? pill("Pago", "good") : pill("Estado de cuenta", "info")}${h.nota ? `<div class="cell-sub">${esc(h.nota)}</div>` : ""}</td><td class="r">${h.tipo === "pago" ? fm(h.monto) : (has(h.intereses) ? `<span class="tiny muted">int.</span> ${fm(h.intereses)}` : "—")}</td><td class="r">${fm(h.saldo)}</td><td class="c"><button class="iconbtn del" data-delhist="${c.id}:${h.id}" aria-label="Borrar del historial">${icon("trash")}</button></td></tr>`).join("")}</tbody></table></div>`
      : `<p class="muted small">Sin movimientos. Cada pago y estado de cuenta que registres queda aquí.</p>`}
  </div>`;
  labelTables($("#drawer"));
  $("#drawer").classList.add("on"); $("#overlay").classList.add("on"); $("#drawer").dataset.id = id;
}
const closeDrawer = () => { $("#drawer").classList.remove("on"); if (!$("#modal").classList.contains("on") && !$("#palette").classList.contains("on")) $("#overlay").classList.remove("on"); };

  const match = e => (!q || norm(e.concepto + " " + e.categoria + " " + e.notas).includes(q)) &&
    (f === "todos" || (f === "vacios" && !has(e.monto)) || (f === "esenciales" && e.esencial === "Sí") || (f === "fijos" && e.tipo === "Fijo"));
  const groups = Object.keys(CATS).map(cat => [cat, S.expenses.filter(e => e.categoria === cat)]).filter(g => g[1].some(match));
  const vacios = S.expenses.filter(e => !has(e.monto)).length;

    ${panel("Guía 50 / 30 / 20", `<div class="grid g3">${rule.map(([l, v, t, c]) => `<div><div class="between small"><b>${l}</b><span>${fp(v / ref)} <span class="muted">/ ${fp(t)}</span></span></div>
      <div style="margin:7px 0 4px">${bar(Math.min(1, v / ref / t), v / ref > t && l !== "Deudas y ahorro" ? "bad" : c)}</div><div class="tiny muted"><span class="amt">${fm(v)}</span> de <span class="amt">${fm(ref * t)}</span></div></div>`).join("")}</div>
      <p class="tiny muted" style="margin:10px 0 0">Necesidades = gastos esenciales. Mientras haya deuda cara, lo ideal es que «Deudas y ahorro» pase del 20%.</p>`, { sub:`sobre un ingreso de ${fm(T.ing)}` })}
  </div>
  <div class="toolbar mt"><div class="affix grow"><span class="pre">${icon("search", 'style="width:15px;height:15px"')}</span><input class="inp" style="width:100%;padding-left:32px" placeholder="Buscar concepto…" value="${esc(sub.q)}" data-filter="q"></div>
    <div class="seg">${[["todos", "Todos"], ["vacios", `Sin monto (${vacios})`], ["esenciales", "Esenciales"], ["fijos", "Fijos"]].map(([k, l]) => `<button class="${f === k ? "on" : ""}" data-filtro="${k}">${l}</button>`).join("")}</div></div>

  ${groups.map(([cat, list]) => `<tr class="grp"><td colspan="6"><i class="swatch" style="background:${CATS[cat]}"></i>${cat}</td><td class="r" data-grp="${cat}">${fm(K.sum(list, C.expMonthly))}</td><td></td></tr>` +
    list.filter(match).map(e => `<tr><td class="click" data-edit="expenses:${e.id}"><div class="cell-title" style="font-weight:500">${esc(e.concepto)}</div>${e.notas ? `<div class="cell-sub">${esc(e.notas)}</div>` : ""}</td><td class="small hide-m">${esc(e.tipo || "")}</td>
      <td class="c hide-m">${e.esencial === "Sí" ? pill("Sí", "info") : '<span class="faint small">No</span>'}</td><td class="small">${esc(e.frecuencia || "")}${e.mes ? ` <span class="muted">· ${esc(e.mes)}</span>` : ""}</td>
      <td class="r"><input class="inl ${has(e.monto) ? "" : "blank"}" type="number" min="0" step="1" inputmode="decimal" value="${esc(e.monto)}" data-inl="expenses:${e.id}:monto" aria-label="Monto de ${esc(e.concepto)}"></td>

/* ---------- Movimientos ---------- */

  const list = monthList.filter(t => (!q || norm(t.concepto + " " + t.notas).includes(q)) && (!cat || t.categoria === cat)).sort((a, b) => b.fecha.localeCompare(a.fecha));
  const rows = Object.keys(CATS).map(c => ({ c, real:K.sum(monthList.filter(t => t.categoria === c), t => num(t.monto)), plan:K.sum(S.expenses.filter(e => e.categoria === c), C.expMonthly) })).filter(r => r.real || r.plan);
  const tot = K.sum(monthList, t => num(t.monto)), plan = K.sum(rows, r => r.plan);
  const months = [-5, -4, -3, -2, -1, 0].map(n => addMonths(mk, n));
  const hist = months.map(k => ({ l:MESES[+k.slice(5) - 1].slice(0, 3), vals:[{ n:"Gastado", c:"var(--primary)", v:K.sum(S.txns.filter(t => monthKey(t.fecha) === k), t => num(t.monto)) }, { n:"Planeado", c:"color-mix(in srgb,var(--faint) 45%,transparent)", v:plan }] }));

      <input class="inp" type="date" name="fecha" value="${mk === monthKey() ? localISO() : mk + "-01"}" aria-label="Fecha">

      <select class="inp" name="categoria" required aria-label="Categoría">${Object.keys(CATS).map(c => `<option ${c === (S.settings.lastCat || "Alimentación") ? "selected" : ""}>${c}</option>`).join("")}</select>
      <div class="affix"><span class="pre">$</span><input class="inp" style="padding-left:24px" name="monto" type="number" min="0" step="0.01" inputmode="decimal" placeholder="0" required aria-label="Monto"></div>
      <button class="btn primary" type="submit">${icon("plus")} Agregar</button></form>
    <p class="tiny muted" style="margin:8px 0 0">Enter para guardar. La categoría se queda como la última que usaste.</p>`) +
  `<div class="grid g21 mt"><div>
    <div class="toolbar"><div class="affix grow"><span class="pre">${icon("search", 'style="width:15px;height:15px"')}</span><input class="inp" style="width:100%;padding-left:32px" placeholder="Buscar…" value="${esc(sub.movq)}" data-filter="movq"></div>
      <select class="inp" data-filter="movcat"><option value="">Todas las categorías</option>${Object.keys(CATS).map(c => `<option ${c === cat ? "selected" : ""}>${c}</option>`).join("")}</select>
      <span class="small muted">${list.length} movimientos · <b class="amt">${fm(K.sum(list, t => num(t.monto)))}</b></span></div>
    ${panel("", rowsTable("txns", [
      { h:"Concepto", v:t => `<div class="cell-title" style="font-weight:500">${esc(t.concepto)}</div>${t.notas ? `<div class="cell-sub">${esc(t.notas)}</div>` : ""}` },
      { h:"Fecha", v:t => `<span class="nowrap">${fmtDate(t.fecha)}</span>` },
      { h:"Categoría", v:t => t.categoria ? `<span class="pill" style="background:color-mix(in srgb,${CATS[t.categoria]} 14%,transparent);color:${CATS[t.categoria]}">${esc(t.categoria)}</span>` : "" },
      { h:"Pagado con", v:t => `<span class="small">${esc(t.pagadoCon || "")}</span>` },
      { h:"Monto", cls:"r", v:t => `<b>${fm(t.monto)}</b>` }], list), { cls:"flush" })}</div>
    <div>${panel("Planeado vs real", `<div class="kv" style="margin-bottom:14px"><span>Gastado</span><span>${fm(tot)}</span><span>Planeado</span><span>${fm(plan)}</span><hr><span class="b">Diferencia</span><span class="${plan - tot < 0 ? "bad" : "good"}">${fm(plan - tot)}</span></div>
      ${rows.map(r => { const p = r.plan ? r.real / r.plan : (r.real ? 1.01 : 0); return `<div style="margin-bottom:11px"><div class="between small"><span><i class="swatch" style="background:${CATS[r.c]}"></i>${r.c}</span><span><span class="amt">${fm(r.real)}</span> <span class="muted">/ <span class="amt">${fm(r.plan)}</span></span></span></div><div style="margin-top:5px">${bar(Math.min(1, p), p > 1 ? "bad" : p > .85 ? "warn" : "good")}</div></div>`; }).join("") || empty("list", "Sin datos este mes")}`, { sub:monthName(mk) })}

}

/* ---------- Ahorros ---------- */
function vAhorros() {
  const T = K.totals(S);
  return ph("Ahorros y bienes", "Solo cuenta como colchón lo que se puede sacar hoy sin castigo.", `<button class="btn primary" data-add="savings">${icon("plus")} Agregar</button>`, "Lo que tienen") +
  `<div class="grid g4">${kpi({ label:"Disponible hoy", value:M(T.ahorroInm), ic:"shield", tone:"teal", foot:"Cuenta como colchón" })}${kpi({ label:"Todo lo que tienen", value:M(T.activos), ic:"piggy", tone:"primary", foot:"Incluye Afore y bienes" })}
    ${kpi({ label:"Todo lo que deben", value:M(T.tdc + T.otras), ic:"debt", tone:"bad", foot:"Tarjetas + otras deudas" })}${kpi({ label:"Patrimonio neto", value:M(T.patrimonio, T.patrimonio < 0 ? "bad" : ""), ic:"trend", tone:"violet", foot:"Lo que tienen − lo que deben" })}</div>
  <div class="mt">${panel("", rowsTable("savings", [
    { h:"Qué es", v:s => `<div class="cell-title">${esc(s.nombre || s.tipo)}</div><div class="cell-sub">${esc(s.tipo || "")}</div>` },
    { h:"Titular", v:s => esc(s.titular || "") },
    { h:"Disponibilidad", v:s => pill(esc(s.disponibilidad || "?"), s.disponibilidad === "Inmediata" ? "good" : s.disponibilidad === "A plazo" ? "warn" : "") },
    { h:"Rendimiento", cls:"r", v:s => fp(s.rendimiento, 1) },
    { h:"Aporte mensual", cls:"r", v:s => fm(s.aportacion) },
    { h:"Saldo / valor", cls:"r", v:s => `<b>${fm(s.saldo)}</b>` }], S.savings), { cls:"flush" })}</div>
  <div class="mt">${patrimonioPanel()}</div>`;
}

function patrimonioPanel() {
  const H = Object.entries(S.historial || {}).sort(([a], [b]) => a.localeCompare(b)).slice(-24);
  const mes = k => `${MESES[+k.slice(5) - 1].slice(0, 3)} ${k.slice(2, 4)}`;
  if (H.length < 2) return panel("Patrimonio mes a mes", `<p class="muted" style="margin:0">Cada mes se guarda sola una foto de lo que tienen y lo que deben. La gráfica aparece desde el mes que entra.</p>`, { sub:"empieza este mes" });
  const rows = H.slice(-6).reverse().map(([k, h], i, arr) => { const neto = h.activos - h.deudas, prev = arr[i + 1] ? arr[i + 1][1].activos - arr[i + 1][1].deudas : null;
    return `<tr><td>${mes(k)}</td><td class="r">${fm(h.activos)}</td><td class="r">${fm(h.deudas)}</td><td class="r"><b class="${neto < 0 ? "bad" : ""}">${fm(neto)}</b></td><td class="r">${prev === null ? "" : `<span class="${neto >= prev ? "good" : "bad"}">${neto >= prev ? "▲" : "▼"} ${fm(Math.abs(neto - prev))}</span>`}</td></tr>`; }).join("");
  return panel("Patrimonio mes a mes", lineChart([{ c:"var(--good)", data:H.map(([, h]) => h.activos) }, { c:"var(--bad)", data:H.map(([, h]) => h.deudas) }], { width:900, height:200, xlabel:i => H[i] ? mes(H[i][0]) : "" }) +
    `<div class="row tiny muted" style="margin:6px 0 12px"><span class="row" style="gap:5px"><i class="swatch" style="background:var(--good)"></i>Lo que tienen</span><span class="row" style="gap:5px"><i class="swatch" style="background:var(--bad)"></i>Lo que deben</span></div>
    <div class="tbl"><table><thead><tr><th>Mes</th><th class="r">Tienen</th><th class="r">Deben</th><th class="r">Neto</th><th class="r">Cambio</th></tr></thead><tbody>${rows}</tbody></table></div>`, { sub:"cuando la línea verde pase a la roja, ya tienen más de lo que deben" });
}

/* ---------- Me deben: fichas de personas o empresas, cada una con sus cuentas ---------- */
const cAbonado = c => K.sum(c.abonos || [], a => num(a.monto));
const cSaldo = c => Math.max(0, Math.round((num(c.monto) - cAbonado(c)) * 100) / 100);
const deudor = id => S.deudores.find(x => x.id === id);
const cuentasDe = id => S.cobros.filter(c => c.deudorId === id);
const cName = c => deudor(c.deudorId)?.nombre || c.persona || "Sin nombre";
/* Busca la ficha por nombre (sin importar acentos ni mayúsculas) o la crea */
function deudorFor(name) {
  const n = (name || "").trim() || "Sin nombre";
  let x = S.deudores.find(d => K.normName(d.nombre) === K.normName(n));
  if (!x) { x = { id:uid(), nombre:n, tipo:"Persona", telefono:"", notas:"" }; S.deudores.push(x); }
  return x;
}
function dStats(id) {
  const list = cuentasDe(id), pend = list.filter(c => !c.liquidado), hoy = localISO();
  const venc = pend.filter(c => c.compromiso && c.compromiso < hoy);
  const moves = list.flatMap(c => [c.fecha || "", ...(c.abonos || []).map(a => a.fecha || "")]).filter(Boolean).sort();
  return { list, pend, venc, total:K.sum(pend, cSaldo), abonado:K.sum(list, cAbonado), last:moves[moves.length - 1] || "" };
}
const waLink = (d, s) => {
  const tel = String(d.telefono || "").replace(/\D/g, ""); if (tel.length < 10) return "";
  const msg = `Hola ${d.nombre}, ¿cómo estás? Te escribo para recordarte lo pendiente: ${s.pend.map(c => `${c.concepto || "cuenta"} (${fm(cSaldo(c))})`).join(", ")}. En total ${fm(s.total)}. ¡Gracias!`;
  return `https://wa.me/${tel.length === 10 ? "52" + tel : tel}?text=${encodeURIComponent(msg)}`;
};
const TIPO_ICON = { "Persona":"🙋", "Familiar":"👪", "Cliente":"🛍️", "Empresa":"🏢", "Otro":"📁" };

function vCobros() {
  if (sub.deudor && deudor(sub.deudor)) return vDeudor(deudor(sub.deudor));
  const hoy = localISO(), mk = monthKey(), q = K.normName(sub.cobq || "");
  const pend = S.cobros.filter(c => !c.liquidado), venc = pend.filter(c => c.compromiso && c.compromiso < hoy);
  const cobradoMes = K.sum(S.cobros, c => K.sum((c.abonos || []).filter(a => monthKey(a.fecha) === mk), a => num(a.monto)));
  const orden = sub.cobord || "monto";
  const fichas = S.deudores.map(d => ({ d, s:dStats(d.id) }))
    .filter(({ d, s }) => !q || K.normName(d.nombre + " " + d.tipo + " " + s.list.map(c => c.concepto).join(" ")).includes(q))
    .sort((a, b) => orden === "nombre" ? a.d.nombre.localeCompare(b.d.nombre) : orden === "reciente" ? b.s.last.localeCompare(a.s.last) : (b.s.total - a.s.total) || a.d.nombre.localeCompare(b.d.nombre));
  const conDeuda = S.deudores.filter(d => dStats(d.id).total > 0).length;
  const card = ({ d, s }) => `<button class="dcard ${s.total ? "" : "zero"}" data-deudor="${d.id}">
      <div class="between"><span class="dc-ic">${TIPO_ICON[d.tipo] || "🙋"}</span>${s.venc.length ? pill(`${s.venc.length} vencida${s.venc.length > 1 ? "s" : ""}`, "bad") : s.total ? "" : pill("Al corriente ✓", "good")}</div>
      <div class="b dc-n">${esc(d.nombre)}</div><div class="tiny muted">${esc(d.tipo || "Persona")} · ${s.pend.length} cuenta${s.pend.length === 1 ? "" : "s"} pendiente${s.pend.length === 1 ? "" : "s"}</div>
      <div class="dc-amt">${M(s.total)}</div><div class="tiny muted">${s.last ? `Último movimiento: ${fmtDate(s.last)}` : "Sin movimientos"}</div></button>`;
  return ph("Me deben", "Una ficha por persona o empresa, con todas sus cuentas, abonos y fechas.", `<button class="btn" data-act="dividir">➗ Dividir un gasto</button><button class="btn" data-add="cobros">${icon("plus")} Anotar deuda</button><button class="btn primary" data-add="deudores">${icon("users")} Persona o empresa</button>`, "Lo que tienen") +
  `<div class="grid g4">${kpi({ label:"Te deben en total", value:M(K.sum(pend, cSaldo)), ic:"users", tone:"good", foot:`${conDeuda} con saldo pendiente` })}
    ${kpi({ label:"Vencidos", value:M(K.sum(venc, cSaldo), venc.length ? "bad" : ""), ic:"alert", tone:venc.length ? "bad" : "primary", foot:venc.length ? `${venc.length} ya pasaron su fecha` : "Ninguno" })}
    ${kpi({ label:"Te pagaron este mes", value:M(cobradoMes), ic:"cash", tone:"teal", foot:"Abonos y pagos completos" })}
    ${kpi({ label:"Fichas", value:String(S.deudores.length), ic:"list", tone:"primary", foot:"Personas y empresas" })}</div>
  ${S.deudores.length ? `<div class="toolbar mt"><input class="inp" type="search" placeholder="Buscar persona, empresa o concepto…" value="${esc(sub.cobq || "")}" data-filter="cobq" aria-label="Buscar">
    <div class="seg">${[["monto", "Más deben"], ["reciente", "Recientes"], ["nombre", "A–Z"]].map(([k, l]) => `<button class="${orden === k ? "on" : ""}" data-cobord="${k}">${l}</button>`).join("")}</div></div>` : ""}
  <div class="dgrid mt">${fichas.map(card).join("") || `<div style="grid-column:1/-1">${panel("", S.deudores.length ? empty("search", "Nadie con ese nombre", "") : empty("users", "Todavía no hay nada anotado", "Crea una ficha por cada persona o empresa que te debe, y adentro anota sus cuentas.", `<button class="btn primary" data-add="deudores">${icon("plus")} Crear la primera ficha</button>`))}</div>`}</div>`;
}

function vDeudor(d) {
  const s = dStats(d.id), hoy = localISO(), wa = waLink(d, s);
  const paid = s.list.filter(c => c.liquidado).sort((a, b) => b.liquidado.localeCompare(a.liquidado));
  const row = c => {
    const sl = cSaldo(c), ab = cAbonado(c), late = c.compromiso && c.compromiso < hoy;
    return `<div class="cobro">
      <div class="cb-main"><div class="b">${esc(c.concepto || "Sin descripción")} ${late ? pill("Vencida", "bad") : ""}</div>
        <div class="tiny muted">${[`Monto ${fm(c.monto)}`, c.fecha ? `desde el ${fmtDate(c.fecha)}` : "", c.compromiso ? `quedó de pagar el ${fmtDate(c.compromiso)}` : ""].filter(Boolean).join(" · ")}</div>
        ${c.notas ? `<div class="tiny">${esc(c.notas)}</div>` : ""}
        ${ab > 0 ? `${bar(ab / num(c.monto), "good", "thin")}<div class="tiny">Ha abonado ${M(ab)} de ${M(c.monto)}</div>` : ""}
        ${(c.abonos || []).length ? `<details class="cb-ab"><summary class="tiny">Ver abonos (${c.abonos.length})</summary>${c.abonos.map(a => `<div class="between tiny"><span>${fmtDate(a.fecha)}${a.nota ? ` · ${esc(a.nota)}` : ""}</span><span>${M(a.monto)} <button class="iconbtn del" data-delabono="${c.id}:${a.id}" aria-label="Borrar abono">${icon("x")}</button></span></div>`).join("")}</details>` : ""}
      </div>
      <div class="cb-side"><div class="cb-amt">${M(sl)}</div><div class="tiny muted">le falta</div>
        <div class="row cb-btns"><button class="btn sm" data-abono="${c.id}">Abono</button><button class="btn sm primary" data-liquidar="${c.id}">${icon("check")} Ya pagó</button><button class="iconbtn" data-edit="cobros:${c.id}" aria-label="Editar">${icon("edit")}</button><button class="iconbtn del" data-del="cobros:${c.id}" aria-label="Quitar">${icon("trash")}</button></div></div>
    </div>`;
  };
  // Estado de cuenta: cada cargo y cada abono en orden, con saldo corrido
  const mov = s.list.flatMap(c => [{ f:c.fecha || "", t:c.concepto || "Cuenta", m:num(c.monto) }, ...(c.abonos || []).map(a => ({ f:a.fecha || "", t:`Abono${a.nota ? " · " + a.nota : ""} (${c.concepto || "cuenta"})`, m:-num(a.monto) }))])
    .sort((a, b) => a.f.localeCompare(b.f) || b.m - a.m);
  let run = 0;
  const ledger = mov.map(x => { run += x.m; return `<tr><td>${x.f ? fmtDate(x.f) : "—"}</td><td>${esc(x.t)}</td><td class="r ${x.m < 0 ? "good" : ""}">${x.m < 0 ? "−" + fm(-x.m) : fm(x.m)}</td><td class="r b">${fm(Math.max(0, run))}</td></tr>`; }).join("");
  return `<div class="ph"><div><div class="eyebrow"><button class="linkbtn" data-deudor="">← Me deben</button></div><h1>${TIPO_ICON[d.tipo] || "🙋"} ${esc(d.nombre)}</h1>
      <p>${esc(d.tipo || "Persona")}${d.telefono ? ` · <a href="tel:${esc(String(d.telefono).replace(/\s/g, ""))}">${esc(d.telefono)}</a>` : ""}${d.notas ? ` · ${esc(d.notas)}` : ""}</p></div>
    <div class="row dh-act"><button class="btn primary" data-addcobro="${d.id}">${icon("plus")} Agregar deuda</button>${wa ? `<a class="btn" href="${wa}" target="_blank" rel="noopener">💬 Recordar por WhatsApp</a>` : ""}<button class="btn" data-edit="deudores:${d.id}">${icon("edit")} Editar ficha</button></div></div>
  <div class="grid g4">${kpi({ label:"Le falta pagar", value:M(s.total), ic:"users", tone:s.total ? "good" : "primary", foot:`${s.pend.length} cuenta${s.pend.length === 1 ? "" : "s"} pendiente${s.pend.length === 1 ? "" : "s"}` })}
    ${kpi({ label:"Vencidas", value:M(K.sum(s.venc, cSaldo), s.venc.length ? "bad" : ""), ic:"alert", tone:s.venc.length ? "bad" : "primary", foot:s.venc.length ? `${s.venc.length} pasaron su fecha` : "Ninguna" })}
    ${kpi({ label:"Ha abonado", value:M(s.abonado), ic:"cash", tone:"teal", foot:"En todas sus cuentas" })}
    ${kpi({ label:"Ya liquidadas", value:String(paid.length), ic:"check", tone:"primary", foot:"Cuentas tachadas" })}</div>
  <div class="mt">${panel("Cuentas pendientes", s.pend.map(row).join("") || empty("check", s.list.length ? "No te debe nada 🎉" : "Sin cuentas todavía", "", `<button class="btn primary" data-addcobro="${d.id}">${icon("plus")} Agregar deuda</button>`), { cls:"flush" })}</div>
  ${mov.length ? `<div class="mt">${panel("Estado de cuenta", `<div class="tbl"><table class="keep"><thead><tr><th>Fecha</th><th>Movimiento</th><th class="r">Monto</th><th class="r">Saldo</th></tr></thead><tbody>${ledger}</tbody></table></div>`, { cls:"flush", sub:"Como en el cuaderno: lo que te quedó a deber y lo que te ha dado" })}</div>` : ""}
  ${paid.length ? `<div class="mt">${panel("Ya pagadas ✓", paid.map(c => `<div class="cobro done"><div class="cb-main"><s>${esc(c.concepto || "Cuenta")} · ${fm(c.monto)}</s><div class="tiny muted">Liquidó el ${fmtDate(c.liquidado)}</div></div>
      <div class="row"><button class="btn sm ghost" data-reabrir="${c.id}">Deshacer</button><button class="iconbtn del" data-del="cobros:${c.id}" aria-label="Borrar">${icon("trash")}</button></div></div>`).join(""), { cls:"flush" })}</div>` : ""}
  <div class="mt"><button class="btn danger sm" data-deldeudor="${d.id}">${icon("trash")} Borrar ficha</button></div>`;
}
/* Cuánto queda para el día a día este mes (y por semana) */
function libreStrip() {
  const L = K.libre(S, localISO()); if (L.plan <= 0) return "";
  const p = L.gastado / L.plan, tone = L.queda < 0 ? "bad" : p > .85 ? "warn" : "good";
  return `<section class="panel lbstrip mt"><div class="lb-main"><div class="lbl">Para el día a día ${L.queda < 0 ? "te pasaste por" : "te quedan"}</div>
    <div class="val">${M(Math.abs(L.queda), tone === "bad" ? "bad" : "")} <span class="tiny muted">este mes</span></div>
    <div class="tiny muted">${L.queda > 0 ? `≈ <b class="amt">${fm(L.semana)}</b> por semana · ` : ""}quedan ${L.dias} día${L.dias > 1 ? "s" : ""} · llevas <span class="amt">${fm(L.gastado)}</span> de <span class="amt">${fm(L.plan)}</span></div>
    <div style="margin-top:8px">${bar(Math.min(1, p), tone)}</div>
    <div class="tiny muted" style="margin-top:6px">Lo planeado en gastos variables (mandado, gasolina…) menos lo que anotas en Movimientos.</div></div>
    <button class="btn" data-fab="txn:">${icon("plus")} Anotar gasto</button></section>`;
}
/* Total de «Me deben» en el Resumen */
function teDebenStrip() {
  if (!S.deudores.length) return "";
  const pend = S.cobros.filter(c => !c.liquidado), hoy = localISO(), venc = pend.filter(c => c.compromiso && c.compromiso < hoy);
  const top = S.deudores.map(d => ({ d, t:dStats(d.id).total })).filter(x => x.t > 0).sort((a, b) => b.t - a.t);
  return `<button class="panel tdstrip mt" data-go="cobros"><span class="ico">${icon("users")}</span>
    <div class="td-main"><div class="lbl">Te deben</div><div class="val">${M(K.sum(pend, cSaldo))}</div>
    <div class="tiny muted">${top.length ? top.slice(0, 3).map(x => `${esc(x.d.nombre)} ${fm(x.t)}`).join(" · ") + (top.length > 3 ? ` · y ${top.length - 3} más` : "") : "Nadie te debe nada 🎉"}</div></div>
    <div class="td-side">${venc.length ? pill(`${venc.length} vencida${venc.length > 1 ? "s" : ""}`, "bad") : ""}<span class="tiny">Ver ${icon("chevr")}</span></div></button>`;
}
function delDeudor(id) {
  const d = deudor(id); if (!d) return;
  const list = cuentasDe(id), pend = list.filter(c => !c.liquidado);
  if (!confirm(`¿Borrar la ficha de ${d.nombre}?${list.length ? `\n\nTambién se borran sus ${list.length} cuenta${list.length > 1 ? "s" : ""}${pend.length ? ` (${pend.length} pendiente${pend.length > 1 ? "s" : ""} por ${fm(K.sum(pend, cSaldo))})` : ""}.` : ""}`)) return;
  const snap = { d, list, idx:S.deudores.indexOf(d) };
  S.deudores = S.deudores.filter(x => x.id !== id); S.cobros = S.cobros.filter(c => c.deudorId !== id);
  sub.deudor = ""; persist(); render();
  toast(`Ficha borrada: ${d.nombre}`, { label:"Deshacer", fn:() => { S.deudores.splice(snap.idx, 0, snap.d); S.cobros.push(...snap.list); persist(); render(); } });
}
function abonoForm(id) {
  const c = S.cobros.find(x => x.id === id); if (!c) return;
  const s = cSaldo(c), fields = [{ k:"monto", l:"¿Cuánto te dio?", t:"money", req:true }, { k:"fecha", l:"Fecha", t:"date", req:true }, { k:"nota", l:"Nota", t:"text", ph:"Opcional", full:true }];
  openModal(`<form id="frm" novalidate><header><div><h2>Abono de ${esc(cName(c))}</h2><p>${esc(c.concepto || "")} · le falta ${fm(s)}</p></div><button type="button" class="iconbtn" data-act="close" aria-label="Cerrar">${icon("x")}</button></header>
    <div class="mb"><div class="form">${fieldHTML(fields[0], "")}${fieldHTML(fields[1], localISO())}${fieldHTML(fields[2], "")}</div></div>
    <footer><span></span><div class="row"><button type="button" class="btn" data-act="close">Cancelar</button><button class="btn primary" type="submit">${icon("check")} Anotar abono</button></div></footer></form>`, { size:"sm" });
  $("#frm").onsubmit = ev => {
    ev.preventDefault();
    const out = readForm(ev.target, fields); if (!out) return;
    if (out.monto <= 0) { toast("Escribe cuánto te dio"); return; }
    const liquida = out.monto >= s;
    if (liquida && !confirm(`Con este abono ${cName(c)} termina de pagar «${c.concepto || "la cuenta"}».\n\n¿Marcarla como pagada?`)) return;
    (c.abonos = c.abonos || []).push({ id:uid(), fecha:out.fecha, monto:out.monto, nota:out.nota });
    if (liquida) c.liquidado = out.fecha;
    persist(); closeModal(); render({ keepScroll:true });
    if (liquida) celebrate();
    toast(liquida ? `🎉 ${cName(c)} terminó de pagar` : `Abono anotado: le falta ${fm(cSaldo(c))}`);
  };
}
function liquidar(id) {
  const c = S.cobros.find(x => x.id === id); if (!c) return;
  const s = cSaldo(c);
  if (!confirm(`¿Confirmas que ${cName(c)} ya te pagó?\n\n${c.concepto ? c.concepto + ": " : ""}le faltaban ${fm(s)}. La cuenta se tacha como pagada.`)) return;
  const ab = s > 0 ? { id:uid(), fecha:localISO(), monto:s, nota:"Liquidó" } : null;
  if (ab) (c.abonos = c.abonos || []).push(ab);
  c.liquidado = localISO(); persist(); render({ keepScroll:true }); celebrate();
  toast(`✓ ${cName(c)} pagó`, { label:"Deshacer", fn:() => { if (ab) c.abonos = c.abonos.filter(a => a.id !== ab.id); c.liquidado = ""; persist(); render({ keepScroll:true }); } });
}
function reabrir(id) {
  const c = S.cobros.find(x => x.id === id); if (!c || !confirm(`¿Volver a poner pendiente «${c.concepto || "la cuenta"}» de ${cName(c)}?`)) return;
  const last = (c.abonos || [])[c.abonos.length - 1];
  if (last && last.nota === "Liquidó") c.abonos.pop();
  c.liquidado = ""; persist(); render({ keepScroll:true }); toast("Cuenta pendiente otra vez");
}

/* ---------- Me deben: dividir un gasto entre varios ---------- */

    <div class="mb"><div class="form">${fieldHTML(fields[0], "")}${fieldHTML(fields[1], "")}${fieldHTML(fields[2], localISO())}${fieldHTML(fields[3], "")}${fieldHTML(fields[4], "Sí")}</div>

/* ---------- Candado con PIN, por aparato. Es una cortina para miradas ajenas: los datos NO se cifran. ---------- */
const PIN_KEY = LS_KEY + "-pin";
let hiddenAt = 0, onUnlock = null;
const pinGet = () => { try { return JSON.parse(localStorage.getItem(PIN_KEY) || "null"); } catch (e) { return null; } };
async function pinHash(pin, salt) { const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(salt + ":" + pin)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, "0")).join(""); }
async function pinOk(pin) { const p = pinGet(); return !!p && await pinHash(pin, p.salt) === p.hash; }
function showLock() {
  if (!pinGet() || $("#lock")) return;
  closeModal(); closeDrawer(); closePalette();
  document.body.classList.add("locked");
  const el = document.createElement("div"); el.id = "lock";
  el.innerHTML = `<form class="lock-box" id="lockForm" autocomplete="off"><div class="lock-ic">🔒</div><h2>${esc(S.settings.hogarNombre || "Finanzas")}</h2><p class="muted small" style="margin:0">Escribe tu PIN</p>
    <input id="lockPin" class="inp" type="password" inputmode="numeric" maxlength="6" autocomplete="off" aria-label="PIN">
    <button class="btn primary" type="submit">Entrar</button><p class="small" id="lockMsg" role="alert"></p>
    <button type="button" class="linkbtn tiny" id="lockForgot">¿Olvidaste tu PIN?</button></form>`;
  document.body.appendChild(el);
  setTimeout(() => $("#lockPin")?.focus(), 50);
  $("#lockForm").onsubmit = async ev => {
    ev.preventDefault();
    if (await pinOk($("#lockPin").value)) { el.remove(); document.body.classList.remove("locked"); const f = onUnlock; onUnlock = null; f?.(); return; }
    const box = el.querySelector(".lock-box"); $("#lockMsg").textContent = "PIN incorrecto"; $("#lockPin").value = "";
    box.classList.remove("shake"); void box.offsetWidth; box.classList.add("shake");
  };
  $("#lockForgot").onclick = () => { $("#lockMsg").innerHTML = "La única salida es borrar los datos de esta app en el navegador y <b>cargar tu último respaldo</b>. Por eso conviene guardar respaldos seguido."; };
}
function pinForm(off) {
  openModal(`<form id="frm" novalidate><header><div><h2>${off ? "Quitar PIN" : "Poner PIN"}</h2><p>${off ? "Escribe el PIN actual." : "De 4 a 6 números. Solo aplica a este aparato."}</p></div><button type="button" class="iconbtn" data-act="close" aria-label="Cerrar">${icon("x")}</button></header>
    <div class="mb"><div class="form"><div class="fld"><label for="pin1">${off ? "PIN actual" : "PIN nuevo"}</label><input id="pin1" type="password" inputmode="numeric" maxlength="6" autocomplete="off"></div>${off ? "" : `<div class="fld"><label for="pin2">Repítelo</label><input id="pin2" type="password" inputmode="numeric" maxlength="6" autocomplete="off"></div>`}</div>
    ${off ? "" : `<div class="callout warn small mt">Si lo olvidas, la única salida es borrar los datos de la app y cargar un respaldo. Guarda uno antes.</div>`}</div>
    <footer><span></span><div class="row"><button type="button" class="btn" data-act="close">Cancelar</button><button class="btn primary" type="submit">${off ? "Quitar" : "Guardar PIN"}</button></div></footer></form>`, { size:"sm" });
  $("#frm").onsubmit = async ev => {
    ev.preventDefault();
    const a = $("#pin1").value;
    if (off) { if (!(await pinOk(a))) return toast("PIN incorrecto"); localStorage.removeItem(PIN_KEY); closeModal(); render({ keepScroll:true }); return toast("PIN quitado"); }
    if (!/^\d{4,6}$/.test(a)) return toast("El PIN lleva de 4 a 6 números");

    closeModal(); render({ keepScroll:true }); toast("🔒 PIN listo: se pedirá al abrir la app");
  };
}

/* En celular las tablas se vuelven tarjetas: cada celda recibe el título de su columna */
function labelTables(root) {
  root.querySelectorAll("table").forEach(t => {
    if (t.classList.contains("keep") || !t.tHead || !t.tHead.rows.length) return;
    const heads = [];
    for (const th of t.tHead.rows[0].cells) for (let i = 0; i < (th.colSpan || 1); i++) heads.push(th.textContent.trim());
    t.classList.add("rt");
    const label = tr => { let i = 0; for (const td of tr.cells) { if (!td.hasAttribute("data-label")) td.dataset.label = td.colSpan > 1 ? "" : (heads[i] || ""); i += td.colSpan || 1; } };
    for (const tb of t.tBodies) for (const tr of tb.rows) label(tr);
    if (t.tFoot) for (const tr of t.tFoot.rows) label(tr);
  });
}
const isMobile = () => window.innerWidth <= 860;
const FOCUS_KEYS = ["data-scr", "data-inl", "data-setting", "data-cfg", "data-emo", "data-plazo", "data-scrbudget", "data-filter", "id"];
function render({ keepScroll = false } = {}) {

  applyTheme(); renderSide();

/* Actualización en vivo sin re-dibujar (para no perder el foco al llenar tablas) */
function liveUpdate() {
  const T = K.totals(S);
  const map = { ing:T.ing, gastos:T.gastos, gfijo:T.gFijo, gvar:T.gVar };
  for (const p of personas()) map["ing:" + p] = K.sum(S.incomes.filter(i => i.persona === p), C.incMonthly);
  $$("[data-live]").forEach(el => { if (el.dataset.live in map) el.textContent = fm(map[el.dataset.live]); });
  $$("[data-rowm]").forEach(el => { const [col, id] = el.dataset.rowm.split(":"); const r = S[col].find(x => x.id === id); if (r) el.innerHTML = rowMonthly(col, r); });
  $$("[data-grp]").forEach(el => { el.textContent = fm(K.sum(S.expenses.filter(e => e.categoria === el.dataset.grp), C.expMonthly)); });

}

function closeModal() { $("#modal").classList.remove("on"); if (!$("#drawer").classList.contains("on")) $("#overlay").classList.remove("on"); }
function fieldHTML(f, v) {
  if (f.sec) return `<div class="fsec">${f.sec}</div>`;
  const req = f.req ? "required" : "", id = "f_" + f.k;
  let input;
  const opts = typeof f.o === "function" ? f.o() : f.o;
  if (f.t === "select") input = `<select id="${id}" name="${f.k}" ${req}><option value="">—</option>${(has(v) && !opts.includes(v) ? [...opts, v] : opts).map(o => `<option ${o === v ? "selected" : ""}>${esc(o)}</option>`).join("")}</select>`;
  else if (f.t === "textarea") input = `<textarea id="${id}" name="${f.k}" rows="2">${esc(v)}</textarea>`;
  else if (f.t === "money") input = `<div class="affix"><span class="pre">$</span><input id="${id}" name="${f.k}" type="number" step="0.01" min="0" inputmode="decimal" value="${esc(v)}" ${req}></div>`;
  else if (f.t === "pct") input = `<div class="affix"><input id="${id}" name="${f.k}" type="number" step="0.01" min="0" max="300" inputmode="decimal" value="${has(v) ? +(v * 100).toFixed(4) : ""}" ${req}><span class="suf">%</span></div>`;
  else if (f.t === "day") input = `<input id="${id}" name="${f.k}" type="number" min="1" max="31" step="1" inputmode="numeric" value="${esc(v)}" ${req}>`;
  else if (f.t === "int") input = `<input id="${id}" name="${f.k}" type="number" min="0" step="1" inputmode="numeric" value="${esc(v)}" ${req}>`;
  else if (f.t === "date") input = `<input id="${id}" name="${f.k}" type="date" value="${esc(v)}" ${req}>`;
  else if (f.sug) input = `<input id="${id}" name="${f.k}" type="text" list="dl_${f.k}" autocomplete="off" placeholder="${esc(f.ph || "")}" value="${esc(v)}" ${req}><datalist id="dl_${f.k}">${f.sug().map(o => `<option value="${esc(o)}">`).join("")}</datalist>`;
  else input = `<input id="${id}" name="${f.k}" type="text" ${f.max ? `maxlength="${f.max}"` : ""} ${f.pattern ? `pattern="${f.pattern}"` : ""} placeholder="${esc(f.ph || "")}" value="${esc(v)}" ${req}>`;
  return `<div class="fld ${f.full || f.t === "textarea" ? "full" : ""}"><label for="${id}">${f.l}${f.req ? ' <span class="req">*</span>' : ""}</label>${input}${f.help ? `<small>${f.help}</small>` : ""}<span class="err"></span></div>`;
}
function readForm(form, fields) {
  const fd = new FormData(form), out = {}; let ok = true;
  form.querySelectorAll(".fld").forEach(f => f.classList.remove("invalid"));
  for (const f of fields) {
    if (!f.k) continue;
    let v = fd.get(f.k); const el = form.querySelector(`[name="${f.k}"]`);
    const bad = msg => { ok = false; const fl = el.closest(".fld"); fl.classList.add("invalid"); fl.querySelector(".err").textContent = msg; };
    if (["money", "day", "int"].includes(f.t)) v = v === "" ? "" : +v;
    else if (f.t === "pct") v = v === "" ? "" : +v / 100;
    else v = (v ?? "").trim();
    if (f.req && (v === "" || v == null)) bad("Este dato es obligatorio");
    else if (f.t === "day" && v !== "" && (v < 1 || v > 31 || !Number.isInteger(v))) bad("Un día entre 1 y 31");
    else if (f.t === "money" && v !== "" && v < 0) bad("No puede ser negativo");
    else if (f.pattern && v && !new RegExp("^" + f.pattern + "$").test(v)) bad("Revisa el formato");
    out[f.k] = v;
  }
  return ok ? out : null;
}

/* ---------- Paleta de comandos ---------- */
let palSel = 0, palItems = [];
function commands() {
  const cmds = NAV.filter(n => n.length > 1).map(n => ({ g:"Ir a", t:n[1], ic:n[2], run:() => go(n[0]) }));
  cmds.push({ g:"Acciones", t:"Registrar gasto", ic:"plus", k:"N", run:() => openForm("txns") });
  for (const c of S.cards) {
    cmds.push({ g:"Acciones", t:`Registrar pago a ${c.nombre}`, ic:"cash", run:() => payForm(c.id) });
    cmds.push({ g:"Acciones", t:`Nuevo estado de cuenta de ${c.nombre}`, ic:"receipt", run:() => stmtForm(c.id) });
  }
  cmds.push({ g:"Acciones", t:"Agregar tarjeta", ic:"card", run:() => openForm("cards") }, { g:"Acciones", t:"Agregar ingreso", ic:"income", run:() => openForm("incomes") },
    { g:"Acciones", t:"Agregar gasto al presupuesto", ic:"budget", run:() => openForm("expenses") }, { g:"Acciones", t:"Abrir asistente", ic:"sparkle", run:() => wizard(0) },
    { g:"Preferencias", t:S.settings.privacy ? "Mostrar montos" : "Modo privado (ocultar montos)", ic:"eye", k:"P", run:togglePriv },
    { g:"Preferencias", t:isDark() ? "Tema claro" : "Tema oscuro", ic:"moon", run:toggleTheme },
    { g:"Datos", t:"Descargar respaldo", ic:"download", run:exportJSON }, { g:"Datos", t:"Imprimir reporte del mes", ic:"print", run:() => { go("reporte"); setTimeout(print, 200); } });
  for (const e of S.expenses) cmds.push({ g:"Presupuesto", t:e.concepto, ic:"budget", sub:e.categoria, run:() => openForm("expenses", e.id) });
  return cmds;
}
function openPalette(q = "") {
  $("#palette").classList.add("on"); $("#overlay").classList.add("on");
  const inp = $("#palInput"); inp.value = q; palSel = 0; drawPalette(); inp.focus();
}
function closePalette() { $("#palette").classList.remove("on"); if (!$("#modal").classList.contains("on") && !$("#drawer").classList.contains("on")) $("#overlay").classList.remove("on"); }
function drawPalette() {
  const q = norm($("#palInput").value);
  palItems = commands().filter(c => !q || norm(c.t + " " + (c.sub || "") + " " + c.g).includes(q)).slice(0, 40);
  palSel = Math.min(palSel, Math.max(0, palItems.length - 1));
  let g = "", html = "";
  palItems.forEach((c, i) => { if (c.g !== g) { g = c.g; html += `<div class="grp">${g}</div>`; } html += `<div class="it ${i === palSel ? "sel" : ""}" data-pal="${i}">${icon(c.ic)}<span>${esc(c.t)}${c.sub ? ` <span class="faint tiny">· ${esc(c.sub)}</span>` : ""}</span>${c.k ? `<em><kbd>${c.k}</kbd></em>` : ""}</div>`; });
  $("#palList").innerHTML = html || `<div class="empty">Nada coincide</div>`;
  $("#palList .sel")?.scrollIntoView({ block:"nearest" });
}
function runPal(i) { const c = palItems[i]; if (!c) return; closePalette(); c.run(); }

/* ---------- Toast con deshacer ---------- */
function toast(msg, action) {
  const t = document.createElement("div"); t.className = "toast"; t.setAttribute("role", "status");
  t.innerHTML = `<span>${esc(msg)}</span>${action ? `<button>${esc(action.label)}</button>` : ""}`;
  if (action) t.querySelector("button").onclick = () => { action.fn(); t.remove(); };
  $("#toasts").appendChild(t); setTimeout(() => t.remove(), action ? 6000 : 2800);
}

function removeRecord(col, id) {
  const idx = S[col].findIndex(x => x.id === id); if (idx < 0) return;

}

document.addEventListener("keydown", e => {
  if (document.body.classList.contains("locked")) return;

  if ($("#palette").classList.contains("on")) {
    if (e.key === "ArrowDown") { e.preventDefault(); palSel = Math.min(palItems.length - 1, palSel + 1); drawPalette(); }
    else if (e.key === "ArrowUp") { e.preventDefault(); palSel = Math.max(0, palSel - 1); drawPalette(); }
    else if (e.key === "Enter") { e.preventDefault(); runPal(palSel); }
    return;
  }
  const chk = document.activeElement?.closest?.("[data-check]");
  if (chk && (e.key === " " || e.key === "Enter")) { e.preventDefault(); chk.click(); return; }
  if (typing || e.ctrlKey || e.metaKey || e.altKey || $("#modal").classList.contains("on")) return;
  if (e.key === "n") { e.preventDefault(); openForm("txns"); }
  else if (e.key === "p") togglePriv();
  else if (e.key === "g") { window._g = Date.now(); }
  else if (window._g && Date.now() - window._g < 900) { const m = { r:"resumen", m:"mes", p:"plan", t:"tarjetas", c:"calendario", i:"ingresos" }[e.key]; if (m) go(m); window._g = 0; }
